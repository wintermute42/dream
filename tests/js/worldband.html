<!doctype html>
<!-- #224: the band of worlds (static/worldband.js, static/worldband.css) in a real browser – wide as in the panel and
     narrow as on a phone; tests/js/worldband.test.mjs reads the report -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The band of worlds</title>
<link rel="stylesheet" href="/static/worldband.css">
<style>
  :root { --idle: #35353e; --idle2: #24242a; --accent: #c78bff; --text: #f2eefb; --muted: #b9b1cf; --line: rgba(255,255,255,.16); }
  body { margin: 0; padding: 8px; background: #141220; color: var(--text); font: 16px system-ui, sans-serif; }
  #wide { width: 420px; } #narrow { width: 190px; margin-top: 12px; }
  button { min-width: 44px; min-height: 44px; width: 100%; }   /* what a page says about its buttons in general */
</style>
</head>
<body>
<div id="wide"><div id="band"></div></div>
<div id="narrow"><div id="small"></div></div>
<script>window.I18N = { t: (text, vars) => (vars ? text.replace(/\{(\w+)\}/g, (m, k) => vars[k]) : text) };   // as i18n.js, in English</script>
<script src="/static/worldband.js"></script>
<script>
(async () => {
  const report = { error: '' };
  try {
    const $ = id => document.getElementById(id), wait = ms => new Promise(r => setTimeout(r, ms));
    const WORLDS = ['classic', 'deepsea', 'ink', 'etching', 'aurora'];
    const sent = [];
    const band = WorldBand.mount($('band'), { send: set => sent.push(set) });
    const el = $('band'), chips = () => [...el.querySelectorAll('.wb-chip')], paces = () => [...el.querySelectorAll('.wb-pace button')];
    const sw = el.querySelector('.wb-switch'), flow = el.querySelector('.wb-flow'), line = () => el.querySelector('.wb-status').textContent;
    const key = (target, k) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    report.empty = { chips: chips().length, status: line() };
    band.worlds(WORLDS);
    band.set({ world: 'classic', world_to: 'deepsea', world_mix: 0.32, world_auto: 120 });
    band.drift({ wait: 0, next: null, idle: false });
    report.chips = chips().map(b => ({ world: b.dataset.world, role: b.getAttribute('role'), name: b.querySelector('.wb-name').textContent, label: b.getAttribute('aria-label'), title: b.title,
      checked: b.getAttribute('aria-checked'), next: b.classList.contains('wb-next'), tab: b.tabIndex, canvas: !!b.querySelector('canvas.wb-pic') }));
    report.group = { role: el.querySelector('.wb-strip').getAttribute('role'), label: $(el.querySelector('.wb-strip').getAttribute('aria-labelledby')).textContent };
    report.mixing = { status: line(), now: flow.getAttribute('aria-valuenow'), text: flow.getAttribute('aria-valuetext'), role: flow.getAttribute('role'), label: flow.getAttribute('aria-label'),
      from: el.querySelector('.wb-from').textContent, to: el.querySelector('.wb-to').textContent, fill: el.querySelector('.wb-fill').style.transform, live: el.querySelector('.wb-live').textContent,
      slider: !!el.querySelector('input') };
    band.set({ world_mix: 0.7 });
    report.past = chips().map(b => [b.getAttribute('aria-checked'), b.classList.contains('wb-next')]);
    // a tap fades over to that world
    band.set({ world: 'classic', world_to: 'deepsea', world_mix: 0 });
    chips()[3].click(); chips()[4].click(); chips()[0].click();
    report.taps = sent.splice(0);
    // the keyboard: the arrows only move, Space or Enter chooses (a button's click)
    chips()[0].focus(); key(chips()[0], 'ArrowRight'); key(document.activeElement, 'ArrowRight');
    report.keys = { focus: document.activeElement.dataset.world, sent: sent.length, tabs: chips().map(b => b.tabIndex) };
    key(document.activeElement, 'End'); report.keys.end = document.activeElement.dataset.world;
    key(document.activeElement, 'ArrowRight'); report.keys.round = document.activeElement.dataset.world;
    document.activeElement.click(); report.keys.chosen = sent.splice(0);
    // the drift: its switch, its pace
    report.auto = { role: sw.getAttribute('role'), on: sw.getAttribute('aria-checked'), label: $(sw.getAttribute('aria-labelledby')).textContent,
      paces: paces().map(b => [b.textContent, b.dataset.v, b.getAttribute('aria-checked'), b.disabled]), group: el.querySelector('.wb-pace').getAttribute('role') };
    paces()[2].click(); band.set({ world_auto: 45 });
    sw.click(); band.set({ world_auto: 0 });
    report.off = { sent: sent.splice(0), on: sw.getAttribute('aria-checked'), paces: paces().map(b => [b.getAttribute('aria-checked'), b.disabled]), status: line() };
    paces()[0].click(); report.off.dead = sent.length;
    sw.click(); report.back = sent.splice(0);
    band.set({ world_auto: 45 });
    band.set({ world_auto: 77 }); report.odd = { paces: paces().map(b => b.getAttribute('aria-checked')), on: sw.getAttribute('aria-checked') };
    // what the line says
    band.set({ world: 'classic', world_to: 'deepsea', world_mix: 0, world_auto: 120 });
    band.drift({ wait: 0, next: 40, idle: false }); report.next = line();
    band.drift({ wait: 160, next: null, idle: false }); band.set({ world: 'deepsea', world_to: 'ink' }); report.wait = line();
    band.drift({ wait: 0, next: null, idle: true }); report.idle = line();
    report.live = el.querySelector('.wb-live').textContent;
    // the small pictures: each world draws its own
    const lit = c => { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let n = 0, sum = [0, 0, 0]; for (let i = 0; i < d.length; i += 4) { if (d[i + 3] > 40 && d[i] + d[i + 1] + d[i + 2] > 90) n++; for (let k = 0; k < 3; k++) sum[k] += d[i + k] * d[i + 3] / 255; } return { lit: n / (d.length / 4), sum: sum.map(v => Math.round(v / (d.length / 4))) }; };
    for (let i = 0; i < 100 && chips().some(b => !b.querySelector('.wb-drawn')); i++) await wait(50);
    report.pictures = chips().map(b => ({ world: b.dataset.world, drawn: !!b.querySelector('.wb-drawn'), ...lit(b.querySelector('canvas')) }));
    report.world = DreamStyle.name;
    // room: the wide column, and a narrow one
    const fits = box => ({ over: box.scrollWidth - box.clientWidth, chips: [...box.querySelectorAll('.wb-chip')].map(b => { const r = b.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; }),
      names: [...box.querySelectorAll('.wb-name')].every(n => n.scrollWidth <= n.clientWidth + 1), status: box.querySelector('.wb-status').getBoundingClientRect().height });
    const small = WorldBand.mount($('small'), { send: () => {}, pictures: false });
    small.worlds([...WORLDS, 'two-more', 'and-another']); small.set({ world: 'ink', world_to: 'etching', world_mix: 0.5, world_auto: 300 });
    report.fit = { wide: fits($('band')), narrow: fits($('small')), plain: $('small').querySelector('[data-world=two-more] .wb-name').textContent };
    // only transform and opacity move
    report.moving = [...el.querySelectorAll('*'), el].flatMap(n => [n, [n, '::before'], [n, '::after']]).map(x => (Array.isArray(x) ? getComputedStyle(x[0], x[1]) : getComputedStyle(x)))
      .filter(s => parseFloat(s.transitionDuration) > 0 || s.animationName !== 'none').map(s => s.transitionProperty + '/' + s.animationName).filter((v, i, a) => a.indexOf(v) === i);
    report.focusRing = (() => { chips()[1].focus(); return getComputedStyle(chips()[1]).outlineStyle; })();
  } catch (err) { report.error += ' ' + (err && err.stack || err); }
  await fetch('/result', { method: 'POST', body: JSON.stringify(report) });
})();
</script>
</body>
</html>
