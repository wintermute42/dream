<!doctype html>
<!-- #221: today's look, drawn through the style layer (static/dreamstyle.js) in a real browser, with a seeded random and
     a clock that stands still: the scenes of tests/js/style-scenes.js. tests/js/style.test.mjs compares the pictures
     with the ones kept in tests/js/style-ref.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style worlds</title>
<style>body { background: #141220; color: #f2eefb; font: 14px system-ui, sans-serif; } canvas { margin: 4px; max-width: 46vw; }</style>
</head>
<body>
<script>
// the same random numbers and the same moment every time, whatever the modules ask for
(() => { let a = 20261123; Math.random = () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; performance.now = () => 54321;
  Object.defineProperty(navigator, 'hardwareConcurrency', { get: () => 8 }); })();   // (the fields of cloud: the same size on every machine)
</script>
<script src="/static/dreambrush.js"></script>
<script src="/static/dreamvis.js"></script>
<script src="/static/dreamlife.js"></script>
<script src="/static/dreameye.js"></script>
<script src="/static/dreamstyle.js"></script>
<script src="/static/world-classic.js"></script>
<script src="/static/world-deepsea.js"></script>
<script src="/static/world-ink.js"></script>
<script src="/tests/style-scenes.js"></script>
<script>
(async () => {
  const report = { error: '', worlds: DreamStyle.names(), motifs: DreamStyle.motifs(), scenes: {} };
  try {
    for (const name of StyleScenes.NAMES) { const c = StyleScenes.draw(name); report.scenes[name] = StyleScenes.small(c); document.body.append(c); }
    // a world nobody registered is today's look; a world that draws only a part gets the rest from the first
    report.unknown = DreamStyle.use('no-such-world');
    DreamStyle.register('test-partial', { life: { draw() { report.partialLife = true; } }, motif: { mandala() { report.partialMotif = true; } } });
    report.used = DreamStyle.use('test-partial');
    DreamStyle.life().draw(); DreamStyle.motif('mandala')();
    report.fallback = DreamStyle.eye().draw === DreamEye.draw && DreamStyle.motif('third') !== undefined && DreamStyle.face().MODES.length === 6 && !!DreamStyle.part('back') && !!DreamStyle.part('you');
    DreamStyle.use('classic');
  } catch (e) { report.error += ' ' + (e && e.stack || e); }
  await fetch('/result', { method: 'POST', body: JSON.stringify(report) });
})();
</script>
</body>
</html>
