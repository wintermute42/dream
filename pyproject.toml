[project]
name = "dream"
version = "0.1.0"
description = "dream – live AI visuals for VJs, Artists and Installations"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.43.0",
    "fastapi>=0.163.0",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "python-multipart>=0.0.33",
    "python-osc>=1.10.2",
    "qrcode>=8.2",
    "syphon-python>=0.2.0 ; sys_platform == 'darwin'",
    "mido>=1.3.3 ; sys_platform == 'darwin'",
    "python-rtmidi>=1.5.8 ; sys_platform == 'darwin'",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.54.0",
    "peft>=0.17",
    "cryptography>=44",
]
