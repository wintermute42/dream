; Dream's little display (#277): M5Stack ATOM Matrix – flash with `pio run -t upload` in this folder (README: Worn devices).
; Every version is pinned: a build today and in a year is the same firmware.
[env:atom-matrix]
platform = espressif32@6.12.0
board = m5stack-atom
framework = arduino
build_flags =
    -DDREAM_FW_VERSION=\"1.0.0\"
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    tzapu/WiFiManager@2.0.17
    symlink://../lib/DreamWear
monitor_speed = 115200
upload_speed = 1500000
