; Dream's USB receiver (#278): M5Stack AtomS3 Lite on the Mac's USB – takes the StickS3's packets by ESP-NOW and hands
; them to Dream over its USB serial line. Flash with `firmware/flash.sh atoms3-receiver` (README: Worn devices).
; Every version is pinned: a build today and in a year is the same firmware.
[env:atoms3-receiver]
platform = espressif32@6.12.0
board = m5stack-atoms3
framework = arduino
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDREAM_FW_VERSION=\"1.0.0\"
lib_deps =
    symlink://../lib/DreamRadio
monitor_speed = 115200
