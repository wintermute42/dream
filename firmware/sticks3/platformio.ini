; Dream on the wrist (#277, #278): M5Stack StickS3 – flash with `firmware/flash.sh sticks3` (README: Worn devices).
; Every version is pinned: a build today and in a year is the same firmware.
[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDREAM_FW_VERSION=\"1.1.0\"
    -DDREAM_IMU_HZ=50
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    tzapu/WiFiManager@2.0.17
    symlink://../lib/DreamRadio
    symlink://../lib/DreamWear
monitor_speed = 115200
