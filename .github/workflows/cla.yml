# Contributor License Agreement (CLA.md): every author of a pull request signs it once by commenting on the pull
# request; the bot keeps the signatures in signatures/cla.json on the branch "cla-signatures" (not on main, so the
# "Protect main" ruleset is untouched). The maintainer and bots are on the allowlist and never asked.
# pull_request_target runs with the repository's token but never checks out or runs the pull request's code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1, pinned to a commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: wintermute42,dependabot[bot],github-actions[bot],claude[bot],bot*
          lock-pullrequest-aftermerge: false
