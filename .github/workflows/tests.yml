# Tests on Linux and macOS (#186, #213): the rights, settings, folders, certificates, MIDI/sensor/playlist helpers and the
# translations. Dream is public, so the runners cost nothing: every pull request to main is tested, both jobs are
# required checks of the "Protect main" ruleset. The real AI on a GPU and the measurements stay local.
# No model, no GPU, no torch (the tests bring a stand-in for it): only the "ci" dependency group is installed.
# The beat tracker (#195) is tested with the runner's own Node (no packages, no browser); the picture chain (#204:
# WebGL 2 against Canvas 2D) with the runner's own Chrome and its software WebGL – nothing is downloaded for it.
# The dream windows (#214) run in the same Chrome, four of them side by side; the test itself is their Dream.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (only what the tests need)
        run: uv sync --locked --only-group ci
      - name: pytest
        run: uv run --no-sync pytest -q
      - name: Translations
        run: python3 scripts/i18n_check.py
      - name: Beat tracker
        run: node --test tests/js/beat.test.mjs
      - name: Picture chain (WebGL 2 against Canvas 2D)
        run: node --test tests/js/gl-stage.test.mjs
      - name: Dream windows (several of them in the runner's Chrome)
        run: node --test tests/js/window.test.mjs
