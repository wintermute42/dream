name: Idea
description: Something Dream could do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Dream to do?
      description: The situation (a gig, an installation, at home …) and what should happen.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
