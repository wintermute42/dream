<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreamy Eyes</title>
<link rel="manifest" href="/static/eyes.webmanifest">
<link rel="icon" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#07060b">
<style>
  /* #156: Dreamy Eyes – a phone that lends its front camera to the dream and looks back with dreaming eyes */
  :root { --text: #efeaf7; --muted: #a79fba; --accent: #c79bff; --line: rgba(255, 255, 255, .14); color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07060b; color: var(--text); overflow: hidden; touch-action: manipulation;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }   /* #162: every touch is theirs */
  #start { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(40, 24, 64, .55), rgba(7, 6, 11, .92) 70%); transition: opacity .6s; }
  #start.gone { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-size: 1.6em; font-weight: 700; letter-spacing: .02em; }
  #go { justify-self: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 0; font: inherit; font-weight: 700;
    background: var(--accent); color: #140b1f; cursor: pointer; }
  #go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #hint { margin: 0 auto; max-width: 30em; color: var(--muted); font-size: .9em; }
  #note { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); max-width: min(90vw, 34em);
    transform: translate(-50%, 8px); opacity: 0; transition: opacity .5s, transform .5s; padding: 8px 16px; border-radius: 14px;
    background: rgba(20, 14, 30, .78); border: 1px solid var(--line); color: var(--text); font-size: .85em; text-align: center; }
  #note.on { opacity: 1; transform: translate(-50%, 0); }
</style>
<script>/* #175: the key stays in the cookie, not in the address bar, history or a shared link */ try { const u = new URL(location.href); if (u.searchParams.has('k')) { u.searchParams.delete('k'); history.replaceState(history.state, '', u.pathname + u.search + u.hash); } } catch (e) {}</script>
</head>
<body>
<canvas id="eyes" role="img" aria-label="Two dreaming eyes that look at you"></canvas>
<div id="start">
  <h1 translate="no">👀 Dreamy Eyes</h1>
  <button id="go">Open the eyes</button>
  <p id="hint">Tap to start: the eyes open and the front camera lends its picture to the dream. Best in fullscreen, the phone standing at eye height.</p>
</div>
<div id="note" role="status" aria-live="polite"></div>
<video id="cam" playsinline muted hidden></video>

<script src="/static/i18n.js"></script>
<script>
  const T = I18N.t;
  I18N.apply();
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('eyes'), main = cv.getContext('2d');
  let g = main;                                        // #160: the eyes are drawn on a layer of their own while a face takes over
  const layer = document.createElement('canvas'), lg = layer.getContext('2d');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let noteT = 0;
  const say = (t, ms = 5000) => { $('note').textContent = t; $('note').classList.add('on'); clearTimeout(noteT); if (ms) noteT = setTimeout(() => $('note').classList.remove('on'), ms); };

  // ---------- the dream, as the stage shows it (the small live preview, about 4 pictures a second) ----------
  const dream = { cur: null, prev: null, at: 0, lum: 0.4, col: [120, 90, 170], dyn: 0, sample: null };
  const probe = document.createElement('canvas'); probe.width = probe.height = 16;
  const pg = probe.getContext('2d', { willReadFrequently: true });
  function analyse(bm) {                               // brightness, colour and how much moved since the last picture
    pg.drawImage(bm, 0, 0, 16, 16);
    const d = pg.getImageData(0, 0, 16, 16).data;
    let r = 0, gg = 0, b = 0, diff = 0;
    for (let i = 0; i < d.length; i += 4) {
      r += d[i]; gg += d[i + 1]; b += d[i + 2];
      if (dream.sample) diff += Math.abs(d[i] - dream.sample[i]) + Math.abs(d[i + 1] - dream.sample[i + 1]) + Math.abs(d[i + 2] - dream.sample[i + 2]);
    }
    const n = d.length / 4;
    dream.col = [r / n, gg / n, b / n];
    dream.lum = (0.2126 * r + 0.7152 * gg + 0.0722 * b) / n / 255;
    dream.dyn = dream.sample ? Math.min(1, diff / n / 255 / 3 * 6) : 0;
    dream.sample = d.slice();
  }
  function view() {
    const s = new WebSocket(`${proto}://${location.host}/view?preview=1&as=eyes`);
    s.binaryType = 'blob';
    s.onmessage = async ev => {
      if (typeof ev.data === 'string') return;
      try {
        const bm = await createImageBitmap(ev.data);
        if (dream.prev) dream.prev.close();
        dream.prev = dream.cur; dream.cur = bm; dream.at = performance.now(); analyse(bm);
      } catch (e) { /* not a picture */ }
    };
    s.onclose = ev => { if (ev.code !== 4403) setTimeout(view, 2000); };
  }

  // ---------- the camera: lent to the stage (front camera only) and faintly seen in the eyes ----------
  const cam = { stream: null, timer: 0, cv: document.createElement('canvas'), encoding: false, lent: false, wait: false };
  let ctl = null;
  const send = m => { if (ctl && ctl.readyState === 1) ctl.send(JSON.stringify(m)); };
  async function camStart() {
    if (!window.isSecureContext || !navigator.mediaDevices) { say(T('The camera needs https – open Dreamy Eyes with its QR code from Dream Control.'), 0); return; }
    try {
      cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 } }, audio: false });
      $('cam').srcObject = cam.stream; await $('cam').play();
    } catch (e) { say(T('Camera not available: {e}', { e: e.message }), 0); return; }
    cam.lent = true; announce();
    if (!face.lm && !face.loading) faceLoad();
    clearInterval(cam.timer); cam.timer = setInterval(frame, 1000 / 12);
  }
  // ---------- #157: who stands in front – found on this phone only, never sent and never kept ----------
  const face = { lm: null, loading: false, at: 0, seen: 0, x: 0.5, y: 0.5, size: 0, smile: 0, every: 80 };
  async function faceLoad() {
    face.loading = true;
    try {
      const { FilesetResolver, FaceLandmarker } = await import('/mp/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks('/mp/wasm');
      const make = (delegate, mode = 'VIDEO') => FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: '/mp/face_landmarker.task', delegate },
        runningMode: mode, numFaces: 1, outputFaceBlendshapes: mode === 'VIDEO' });
      try { face.lm = await make('GPU'); face.delegate = 'GPU'; } catch (e) { face.lm = await make('CPU'); face.delegate = 'CPU'; }
      face.stillMaker = make;
      try { face.still = await make(face.delegate, 'IMAGE'); } catch (e) { face.still = null; }
      for (const f of Object.values(aiFaces)) if (!f.found) { const fe = aiFaceEyes(f.img); if (fe) f.eyes = fe; f.found = true; }   // faces that came first
    } catch (e) { face.lm = null; }                  // without it the eyes simply dream on by themselves
    face.loading = false;
  }
  function faceTick(t) {                               // where the face is, how big, and whether it smiles
    const v = $('cam');
    if (!face.lm || !v.videoWidth || t - face.at < face.every) return;
    face.at = t;
    try {
      const r = face.lm.detectForVideo(v, t);
      const lm = r.faceLandmarks && r.faceLandmarks[0];
      if (!lm) return;
      let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
      for (const q of lm) { if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x; if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y; }
      face.x = (x0 + x1) / 2; face.y = (y0 + y1) / 2; face.size = x1 - x0; face.seen = t;
      const cats = r.faceBlendshapes && r.faceBlendshapes[0] ? r.faceBlendshapes[0].categories : [];
      const sc = n => (cats.find(c => c.categoryName === n) || {}).score || 0;
      face.smile = (sc('mouthSmileLeft') + sc('mouthSmileRight')) / 2;
      face.bs = Object.fromEntries(cats.map(c => [c.categoryName, c.score]));   // #162: the whole expression, for mirroring
    } catch (e) { /* a frame it could not read */ }
  }

  // #162: while they love the fire, flames rise from the bottom of the screen and the night glows warm
  function drawFlames(t, k) {
    const n = (W > H ? 11 : 7) * (perf > 30 ? 1 : 0.7) | 0, w = W / n, base = H + 8;
    g.save(); g.globalCompositeOperation = 'lighter';
    const glow = g.createLinearGradient(0, H, 0, H * 0.3);
    glow.addColorStop(0, `rgba(255,80,15,${0.3 * k})`); glow.addColorStop(1, 'rgba(255,60,10,0)');
    g.fillStyle = glow; g.fillRect(0, H * 0.3, W, H * 0.7);
    const LAYERS = [[0.36, 0.95, 310, [255, 70, 20], [200, 30, 10]], [0.25, 0.7, 250, [255, 140, 30], [240, 80, 20]], [0.13, 0.42, 200, [255, 235, 160], [255, 180, 60]]];
    LAYERS.forEach(([hh, ww, sp, c0, c1], li) => {
      for (let i = -1; i <= n; i++) {
        const s = i * 12.9898 + li * 78.233, ph = t / sp;
        const fl = 0.62 + 0.2 * Math.sin(ph + s) + 0.18 * Math.sin(ph * 2.3 + s * 1.7);   // each tongue flickers on its own
        const h = H * hh * fl * k * (0.6 + 0.4 * Math.sin(s * 3.1) ** 2);
        const x = (i + 0.5 + li * 0.33) * w, sw = Math.sin(ph * 1.4 + s * 2) * w * 0.45, hw = w * ww;
        const gr = g.createLinearGradient(0, base, 0, base - h);
        gr.addColorStop(0, `rgba(${c0},${0.5 * k})`); gr.addColorStop(0.45, `rgba(${c1},${0.3 * k})`); gr.addColorStop(1, `rgba(${c1},0)`);
        g.fillStyle = gr; g.beginPath(); g.moveTo(x - hw, base);     // a round belly, a licking tip
        g.bezierCurveTo(x - hw, base - h * 0.45, x - hw * 0.2 + sw * 0.5, base - h * 0.62, x + sw, base - h);
        g.bezierCurveTo(x + hw * 0.2 + sw * 0.5, base - h * 0.62, x + hw, base - h * 0.45, x + hw, base); g.closePath(); g.fill();
      }
    });
    g.restore();
  }
  // ---------- #162: Dreamy loves fire – flames on the camera: very bright, saturated red-orange-yellow that flickers ----------
  const fire = { cv: document.createElement('canvas'), prev: null, at: 0, score: 0, x: 0.5, y: 0.5, on: false, since: 0, gone: 0, longing: 0 };
  fire.cv.width = 64; fire.cv.height = 48;
  function fireTick(t) {
    const v = $('cam');
    if (!v.videoWidth || t - fire.at < 100) return;
    fire.at = t;
    const fc = fire.cv.getContext('2d', { willReadFrequently: true });
    fc.drawImage(v, 0, 0, 64, 48);
    const d = fc.getImageData(0, 0, 64, 48).data, n = 64 * 48, mask = new Uint8Array(n);
    let hot = 0, sx = 0, sy = 0, flick = 0;
    for (let i = 0; i < n; i++) {
      const r = d[i * 4], gr = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, gr, b), mn = Math.min(r, gr, b);
      const sat = mx ? (mx - mn) / mx : 0;
      // flame light: very bright, red ≥ green > blue, clearly saturated (skin and lamps are paler or not orange)
      if (r > 200 && mx > 215 && r >= gr && gr > b * 1.15 && sat > 0.42 && (gr - b) > 35) { mask[i] = 1; hot++; sx += i % 64; sy += (i / 64) | 0; }
      if (fire.prev && mask[i] !== fire.prev[i]) flick++;
    }
    const frac = hot / n, change = hot ? flick / Math.max(hot, 1) : 0;
    fire.prev = mask;
    if (hot) { fire.x = sx / hot / 64; fire.y = sy / hot / 48; }
    // a flame flickers: some of its pixels change from frame to frame – a still orange lamp does not
    const raw = frac > 0.004 ? Math.min(1, frac * 25) * Math.min(1, 0.25 + change * 1.5) : 0;
    fire.score = lerp(fire.score, raw, raw > fire.score ? 0.35 : 0.08);
    const wasOn = fire.on;
    // on at once, off only after 1.5 s without fire: no flutter while flames dip for a moment
    if (fire.score > 0.12) fire.low = 0; else fire.low = fire.low || t;
    fire.on = fire.on ? !(fire.low && t - fire.low > 1500) : fire.score > 0.3;
    if (fire.on && !wasOn) { fire.since = t; fire.flameShown = false; }
    if (fire.on && t - (fire.sent || 0) > 2000) { fire.sent = t; send({ fire: true }); }   // the Mac paints burning faces
    if (!fire.on && wasOn) { fire.gone = t; fire.longing = t + 3000; }
  }

  function camStop(why) {
    clearInterval(cam.timer); cam.lent = false;
    if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
    cam.stream = null; $('cam').srcObject = null;
    if (why) say(why, 0);
  }
  function announce() { if (cam.lent) { cam.wait = true; send({ feed: { cam: true, facing: 'user' } }); } }
  function frame() {                                   // about 12 pictures a second, 640 px wide
    const v = $('cam');
    if (!ctl || ctl.readyState !== 1 || ctl.bufferedAmount > 300000 || cam.encoding || !v.videoWidth) return;
    const W = 640, H = Math.round(W * v.videoHeight / v.videoWidth);
    if (cam.cv.width !== W || cam.cv.height !== H) { cam.cv.width = W; cam.cv.height = H; }
    cam.cv.getContext('2d').drawImage(v, 0, 0, W, H);
    cam.encoding = true;
    cam.cv.toBlob(b => { cam.encoding = false; if (b && ctl && ctl.readyState === 1 && cam.lent) ctl.send(b); }, 'image/jpeg', 0.7);
  }
  function connect() {
    ctl = new WebSocket(`${proto}://${location.host}/ctl?role=remote&as=eyes`);   // #166: as the eyes, even on a Control device
    ctl.onopen = () => announce();
    ctl.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.feeds_mine) { if (m.feeds_mine.includes('cam')) cam.wait = false; else if (cam.lent && !cam.wait) camStop(T('Dream Control took the camera back – tap to lend it again.')); }
      if (m.aimasks) {                                 // #160; #166: what the server dropped goes here too
        for (const k of Object.keys(aiFaces)) if (!(k in m.aimasks)) delete aiFaces[k];
        for (const [k, u] of Object.entries(m.aimasks)) aiFaceLoad(k, u);
      }
      if (m.eyes_cfg) { trance.every = +m.eyes_cfg.trance_every || 0; tranceSchedule(performance.now(), true); }   // #172
      if (m.trance) tranceStart(performance.now());
      if (m.feed_taken === 'cam') camStop(T('Dream Control took the camera back – tap to lend it again.'));
    };
    ctl.onclose = ev => {
      if (ev.code === 4403) { camStop(T('No access – the code of Dreamy Eyes is no longer valid.')); return; }
      setTimeout(connect, 1500);
    };
  }

  // ---------- the eyes ----------
  let W = 0, H = 0, dpr = 1;
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    main.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', size); size();
  // the iris' fibres, drawn once: fine radial strands, light and dark
  const fib = document.createElement('canvas'); fib.width = fib.height = 512;
  (() => {
    const f = fib.getContext('2d'), c = 256;
    for (let i = 0; i < 900; i++) {
      const a = Math.random() * Math.PI * 2, r0 = 70 + Math.random() * 40, r1 = 170 + Math.random() * 86, wob = (Math.random() - 0.5) * 0.25;
      f.strokeStyle = Math.random() < 0.55 ? `rgba(255,255,255,${0.05 + Math.random() * 0.16})` : `rgba(0,0,0,${0.08 + Math.random() * 0.2})`;
      f.lineWidth = 0.6 + Math.random() * 1.6;
      f.beginPath(); f.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
      f.quadraticCurveTo(c + Math.cos(a + wob) * (r0 + r1) / 2, c + Math.sin(a + wob) * (r0 + r1) / 2, c + Math.cos(a) * r1, c + Math.sin(a) * r1);
      f.stroke();
    }
    const ring = f.createRadialGradient(c, c, 60, c, c, 256);   // the collarette and the dark limbal ring
    ring.addColorStop(0, 'rgba(255,240,220,.18)'); ring.addColorStop(0.32, 'rgba(255,240,220,0)');
    ring.addColorStop(0.86, 'rgba(10,4,20,0)'); ring.addColorStop(1, 'rgba(10,4,20,.95)');
    f.fillStyle = ring; f.fillRect(0, 0, 512, 512);
  })();
  const st = { open: 0, openT: 1, pupil: 0.4, gx: 0, gy: 0, tx: 0, ty: 0, nextLook: 0, blinkAt: performance.now() + 2500, blink: 0, rot: 0, energy: 0, wake: 0 };
  const lerp = (a, b, k) => a + (b - a) * k;
  // #157: the eyes' look changes softly now and then – shade, liner, lashes, brows
  const LOOKS = {
    rose:   { hue: 318, sat: 55, light: 48, alpha: 0.5,  glitter: 6,  wing: 1,   liner: 1,   lashes: 1,    curl: 1,   lower: 1,   arch: 1,   brow: 1 },
    smoky:  { hue: 270, sat: 18, light: 30, alpha: 0.62, glitter: 3,  wing: 1.35, liner: 1.5, lashes: 1.1, curl: 1.1, lower: 1.3, arch: 0.8, brow: 1.2 },
    golden: { hue: 40,  sat: 75, light: 55, alpha: 0.48, glitter: 12, wing: 0.7, liner: 0.8, lashes: 1,    curl: 0.9, lower: 0.8, arch: 1.1, brow: 0.9 },
    nymph:  { hue: 175, sat: 60, light: 50, alpha: 0.45, glitter: 16, wing: 0.5, liner: 0.7, lashes: 1.3,  curl: 1.3, lower: 1.1, arch: 1.25, brow: 0.8 },
    doll:   { hue: 340, sat: 65, light: 66, alpha: 0.4,  glitter: 5,  wing: 0,   liner: 0.9, lashes: 1.45, curl: 0.7, lower: 1.5, arch: 1.4, brow: 0.75 },
  };
  const look = { name: 'rose', cur: { ...LOOKS.rose }, next: performance.now() + 45000 };
  function lookTick(t, dt) {
    if (t > look.next) { const o = Object.keys(LOOKS).filter(k => k !== look.name); look.name = o[Math.random() * o.length | 0]; look.next = t + 45000 + Math.random() * 45000; }
    const want = LOOKS[look.name], k = 1 - Math.exp(-dt * 0.8);   // about three seconds from one look to the next
    for (const key in want) {
      if (key === 'hue') { const d = ((want.hue - look.cur.hue + 540) % 360) - 180; look.cur.hue = (look.cur.hue + d * k + 360) % 360; }
      else look.cur[key] += (want[key] - look.cur[key]) * k;
    }
  }
  // #157: the brows come only for a feeling – surprise, joy, sadness, doubt, a frown, curiosity – then they fade again
  const EMO = {   // offsets in eye heights (negative: up) for the inner end, the peak and the outer end; [left, right]
    surprise: [{ inner: -0.55, peak: -0.6, outer: -0.4 }, { inner: -0.55, peak: -0.6, outer: -0.4 }],
    joy:      [{ inner: -0.1, peak: -0.25, outer: 0.05 }, { inner: -0.1, peak: -0.25, outer: 0.05 }],
    sad:      [{ inner: -0.6, peak: 0, outer: 0.45 }, { inner: -0.6, peak: 0, outer: 0.45 }],
    doubt:    [{ inner: -0.5, peak: -0.55, outer: -0.3 }, { inner: 0.15, peak: 0.1, outer: 0.05 }],
    frown:    [{ inner: 0.6, peak: 0.15, outer: -0.3 }, { inner: 0.6, peak: 0.15, outer: -0.3 }],
    curious:  [{ inner: -0.3, peak: -0.35, outer: -0.15 }, { inner: -0.15, peak: -0.25, outer: -0.2 }],
  };
  const brow = { al: 0, emo: null, until: 0, mirrorWant: [{ inner: 0, peak: 0, outer: 0 }, { inner: 0, peak: 0, outer: 0 }], next: performance.now() + 20000, cur: [{ inner: 0, peak: 0, outer: 0 }, { inner: 0, peak: 0, outer: 0 }], lastEnergy: 0 };
  function feel(emo, t, ms) { if (brow.emo !== emo || t > brow.until - 400) { brow.emo = emo; brow.until = t + ms; } else brow.until = Math.max(brow.until, t + ms); }
  function browTick(t, dt, present) {
    // what calls for a feeling right now
    if (fx.surprise > t || (present && face.size > 0.45)) feel('surprise', t, 1800);
    else if (grin.a > 0.4) feel('joy', t, 1200);
    else if (fx.mood === 'tear') feel('sad', t, 3200);
    else if (fx.mood === 'cross') feel('doubt', t, 1800);
    else if (t > 12000 && t > (brow.spikeAt || 0) && st.energy > 0.45 && st.energy - brow.lastEnergy > 0.2) {   // the dream suddenly gets wild
      feel('surprise', t, 1600); brow.spikeAt = t + 15000;
    }
    else if (t > brow.next) {                          // now and then by itself – frowning only in a dark, wild dream
      const pick = dream.lum < 0.3 && st.energy > 0.45 && Math.random() < 0.4 ? 'frown' : ['curious', 'doubt', 'joy', 'sad'][Math.random() * 4 | 0];
      feel(pick, t, 2500 + Math.random() * 1500); brow.next = t + (20000 + Math.random() * 30000) * pace(t);
    }
    if (mirror.on) {                                   // #162: while mirroring, the brows copy the person's
      const inner = bsv('browInnerUp'), outs = [bsv('browOuterUpLeft'), bsv('browOuterUpRight')], down = [bsv('browDownLeft'), bsv('browDownRight')];
      if (Math.max(inner, ...outs, ...down) > 0.25) {
        brow.mirrorAt = t;
        for (const sd of [0, 1]) brow.mirrorWant[sd] = { inner: -0.6 * inner + 0.6 * down[sd], peak: -0.35 * (inner + outs[sd]), outer: -0.55 * outs[sd] + 0.15 * down[sd] };
      }
    }
    brow.lastEnergy = lerp(brow.lastEnergy, st.energy, 1 - Math.exp(-dt * 0.5));
    const mirrored = t - (brow.mirrorAt || -1e9) < 600;
    const on = mirrored || (brow.emo && t < brow.until);
    brow.al = lerp(brow.al, on ? 1 : 0, 1 - Math.exp(-dt * (on ? 7 : 2.5)));
    if (!on && brow.al < 0.02) brow.emo = null;
    const want = mirrored ? brow.mirrorWant : brow.emo ? EMO[brow.emo] : null, k = 1 - Math.exp(-dt * 8);
    for (const sd of [0, 1]) for (const key of ['inner', 'peak', 'outer']) brow.cur[sd][key] = lerp(brow.cur[sd][key], want ? want[sd][key] : 0, k);
  }
  function almond(cx, cy, a, b, up, lo, yL, yR) {      // the eye's opening: upper and lower lid as two curves

      const p = touch.pts.get(e.pointerId);
      if (p && p.moved < 12 && touch.pts.size === 1) { fx.irisNext = 0; st.wake = Math.max(st.wake, 0.7); p.long = true; }
    }, 700);
  });
  cv.addEventListener('pointermove', e => {
    const p = touch.pts.get(e.pointerId);
    if (!p) return;
    const now = performance.now(), d = Math.hypot(e.clientX - p.x, e.clientY - p.y), speed = d / Math.max(1, now - p.lt);
    p.moved += d; p.x = e.clientX; p.y = e.clientY; p.lt = now;
    touch.x = e.clientX; touch.y = e.clientY; touch.lookUntil = now + 1500;
    if (touch.pts.size === 2 && touch.pinch0) { touch.pupilK = Math.max(0.55, Math.min(1.7, touch.k0 * pinchDist() / touch.pinch0)); return; }
    if (now - touch.sparkAt > 35 && d > 2) {          // a trail of sparks in the dream's colours
      touch.sparkAt = now;
      decor.push({ kind: 'stars', x: e.clientX, y: e.clientY, born: now, life: 1500, size: Math.min(W, H) * 0.13, big: 3.6, hue: hueOf(dream.col) + (now / 8) % 360, spin: 1,
        puffs: Array.from({ length: 5 }, () => [Math.random() * Math.PI * 2, 0.15 + Math.random() * 0.6, Math.random()]) });   // bigger and brighter than before
    }
    // strokes anywhere on the screen: petting – a finger on a phone is quicker than a mouse, so not too strict
    if (speed < 2.5) {
      touch.stroke += d;
      touch.blissAt = now;                             // #172: petting deepens (by its time, see the frame)
      if (touch.stroke > Math.max(...eyesAt.map(x => x[2])) * 1.6 && touch.loveUntil < now) { touch.loveUntil = now + 3500; feel('joy', now, 3500); touch.stroke = 0; }
    } else touch.stroke *= 0.98;
  });
  const lift = e => {
    const p = touch.pts.get(e.pointerId);
    touch.pts.delete(e.pointerId); clearTimeout(touch.longTimer);
    if (touch.pts.size < 2) touch.pinch0 = 0;
    if (!p || p.long || p.moved > 12 || performance.now() - p.t0 > 400 || e.type === 'pointercancel') return;
    const now = performance.now(), sd = onEye(p.x, p.y);
    if (sd >= 0) {                                     // a poke: that eye flinches, they are surprised – three quick ones annoy them
      touch.poke[sd] = now; touch.pokes = touch.pokes.filter(x => now - x < 4000).concat(now);
      if (touch.pokes.length >= 3) { feel('frown', now, 2500); touch.crossUntil = now + 1800; touch.pokes = []; }
      else feel('surprise', now, 1200);
    } else if (now - touch.lastTap < 350) {            // a double tap: they sparkle
      moodStart('sparkle', now); touch.lastTap = 0;
    } else {                                           // a tap on the night: a bloom of light opens there
      touch.lastTap = now; st.wake = Math.max(st.wake, 0.4);
      decor.push({ kind: Math.random() < 0.5 ? 'bloom' : 'mandala', x: p.x, y: p.y, born: now, life: 5000, size: Math.min(W, H) * 0.13,
        hue: hueOf(dream.col) + (Math.random() - 0.5) * 90, spin: Math.random() < 0.5 ? -1 : 1, puffs: [] });
    }
  };
  cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
  if (new URLSearchParams(location.search).has('debug')) window.dreamyEyes = { st, face, grin, decor, fx, moodStart, spawn, bs, look, LOOKS, brow, feel, aiFaces, portal, mirror, seg, segLoad, tempo, touch, fire, you, trance, tranceStart, eyesAt: () => eyesAt };   // for the tests only
  view(); connect();
})();
