<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreamy Eyes</title>
<link rel="manifest" href="/static/eyes.webmanifest">
<link rel="icon" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#07060b">
<style>
  /* #156: Dreamy Eyes – a phone that lends its front camera to the dream and looks back with dreaming eyes */
  :root { --text: #efeaf7; --muted: #a79fba; --accent: #c79bff; --line: rgba(255, 255, 255, .14); color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07060b; color: var(--text); overflow: hidden; touch-action: manipulation;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }   /* #162: every touch is theirs */
  #start { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(40, 24, 64, .55), rgba(7, 6, 11, .92) 70%); transition: opacity .6s; }
  #start.gone { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-size: 1.6em; font-weight: 700; letter-spacing: .02em; }
  #go { justify-self: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 0; font: inherit; font-weight: 700;
    background: var(--accent); color: #140b1f; cursor: pointer; }
  #go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #hint { margin: 0 auto; max-width: 30em; color: var(--muted); font-size: .9em; }
  #note { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); max-width: min(90vw, 34em);
    transform: translate(-50%, 8px); opacity: 0; transition: opacity .5s, transform .5s; padding: 8px 16px; border-radius: 14px;
    background: rgba(20, 14, 30, .78); border: 1px solid var(--line); color: var(--text); font-size: .85em; text-align: center; }
  #note.on { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="/static/common.js" data-hide-key></script><!-- #175: the key stays in the cookie, not in the address bar; and what the pages share -->
</head>
<body>
<canvas id="eyes" role="img" aria-label="Two dreaming eyes that look at you"></canvas>
<div id="start">
  <h1 translate="no">👀 Dreamy Eyes</h1>
  <button id="go">Open the eyes</button>
  <p id="hint">Tap to start: the eyes open and the front camera lends its picture to the dream. Best in fullscreen, the phone standing at eye height.</p>
</div>
<div id="note" role="status" aria-live="polite"></div>
<video id="cam" playsinline muted hidden></video>

<script src="/static/i18n.js"></script>
<script src="/static/measure.js"></script>
<script src="/static/dreambrush.js"></script>
<script src="/static/dreamvis.js"></script>
<script src="/static/dreamlife.js"></script>
<script src="/static/dreamyou.js"></script>
<script src="/static/dreameye.js"></script>
<script src="/static/dreamstyle.js"></script>
<script src="/static/world-classic.js"></script>
<script src="/static/world-deepsea.js"></script>
<script src="/static/world-ink.js"></script>
<script src="/static/dreamfire.js"></script>
<script>
  const T = I18N.t;
  I18N.apply();
(() => {
  'use strict';
  const { hueOf, stamp, tinted } = DreamBrush;   // #201, #221: the brushes shared with the dream windows and every style world
  const $ = id => document.getElementById(id);
  const cv = $('eyes'), main = cv.getContext('2d');
  let g = main;                                        // #160: the eyes are drawn on a layer of their own while a face takes over
  const layer = document.createElement('canvas'), lg = layer.getContext('2d');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let noteT = 0;
  const say = (t, ms = 5000) => { $('note').textContent = t; $('note').classList.add('on'); clearTimeout(noteT); if (ms) noteT = setTimeout(() => $('note').classList.remove('on'), ms); };

  // ---------- the dream, as the stage shows it (the small live preview, about 4 pictures a second) ----------
  const dream = { cur: null, prev: null, at: 0, lum: 0.4, col: [120, 90, 170], dyn: 0, sample: null, pulse: 0, beatAt: -1e9 };
  const probe = document.createElement('canvas'); probe.width = probe.height = 16;
  const pg = probe.getContext('2d', { willReadFrequently: true });
  function analyse(bm) {                               // brightness, colour and how much moved since the last picture
    pg.drawImage(bm, 0, 0, 16, 16);
    const d = pg.getImageData(0, 0, 16, 16).data, n = d.length / 4;
    let diff = 0;
    if (dream.sample) for (let i = 0; i < d.length; i += 4) diff += Math.abs(d[i] - dream.sample[i]) + Math.abs(d[i + 1] - dream.sample[i + 1]) + Math.abs(d[i + 2] - dream.sample[i + 2]);
    Object.assign(dream, DreamBrush.brightness(d, 16, 16));   // col, lum, and L(u, v): how bright it is where
    dream.dyn = dream.sample ? Math.min(1, diff / n / 255 / 3 * 6) : 0;
    dream.sample = d.slice();
  }
  // #188: the dream as it glows behind the eyes – brighter, more saturated – filtered once per picture, not every frame
  const glows = [document.createElement('canvas'), document.createElement('canvas')];
  dream.gi = 0;
  function glowIn(bm) {                                // the newest picture into the canvas the one before last left free
    dream.gi ^= 1;
    const c = glows[dream.gi], x = c.getContext('2d');
    if (c.width !== bm.width || c.height !== bm.height) { c.width = bm.width; c.height = bm.height; } else x.clearRect(0, 0, c.width, c.height);
    x.filter = 'brightness(1.35) saturate(1.3)'; x.drawImage(bm, 0, 0); x.filter = 'none';
  }
  const glowCur = () => glows[dream.gi], glowPrev = () => glows[dream.gi ^ 1];
  function view() {
    const s = new WebSocket(`${proto}://${location.host}/view?preview=1&as=eyes`);
    s.binaryType = 'blob';
    s.onmessage = async ev => {
      if (typeof ev.data === 'string') {                // #218: the music's beat – a number, all the eyes are told
        try { const p = JSON.parse(ev.data).pulse; if (typeof p === 'number' && p >= 0) { dream.pulse = Math.max(dream.pulse, Math.min(1, p)); dream.beatAt = performance.now(); } } catch (e) { /* not for the eyes */ }
        return;
      }
      try {
        const bm = await createImageBitmap(ev.data);
        if (dream.prev) dream.prev.close();
        dream.prev = dream.cur; dream.cur = bm; dream.at = performance.now(); analyse(bm); glowIn(bm);
      } catch (e) { /* not a picture */ }
    };
    s.onclose = ev => { if (ev.code !== 4403) setTimeout(view, 2000); };
  }

  // ---------- the camera: lent to the stage (front camera only) and faintly seen in the eyes ----------
  const cam = { stream: null, timer: 0, lent: false, wait: false };
  let ctl = null;
  const send = m => { if (ctl && ctl.readyState === 1) ctl.send(JSON.stringify(m)); };
  const measureMe = DreamMeasure('eyes', send);       // #180: its frames during a measurement run
  async function camStart() {
    if (!window.isSecureContext || !navigator.mediaDevices) { say(T('The camera needs https – open Dreamy Eyes with its QR code from Dream Control.'), 0); return; }
    try {
      cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 } }, audio: false });
      $('cam').srcObject = cam.stream; await $('cam').play();
    } catch (e) { say(T('Camera not available: {e}', { e: e.message }), 0); return; }
    cam.lent = true; announce();
    if (!face.lm && !face.loading) faceLoad();
    clearInterval(cam.timer); cam.timer = setInterval(frame, 1000 / 12);
  }
  // ---------- #157: who stands in front – found on this phone only, never sent and never kept ----------
  const face = { lm: null, loading: false, at: 0, seen: 0, x: 0.5, y: 0.5, size: 0, smile: 0, every: 80 };
  async function faceLoad() {
    face.loading = true;
    try {
      const { FilesetResolver, FaceLandmarker } = await import('/mp/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks('/mp/wasm');
      const make = (delegate, mode = 'VIDEO') => FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: '/mp/face_landmarker.task', delegate },
        runningMode: mode, numFaces: 1, outputFaceBlendshapes: mode === 'VIDEO' });
      try { face.lm = await make('GPU'); face.delegate = 'GPU'; } catch (e) { face.lm = await make('CPU'); face.delegate = 'CPU'; }
      face.stillMaker = make;
      try { face.still = await make(face.delegate, 'IMAGE'); } catch (e) { face.still = null; }
      for (const f of Object.values(aiFaces)) if (!f.found) { const fe = aiFaceEyes(f.img); if (fe) f.eyes = fe; f.found = true; }   // faces that came first
    } catch (e) { face.lm = null; }                  // without it the eyes simply dream on by themselves
    face.loading = false;
  }
  function faceTick(t) {                               // where the face is, how big, and whether it smiles
    const v = $('cam');
    if (!face.lm || !v.videoWidth || t - face.at < face.every) return;
    face.at = t;
    try {
      const r = face.lm.detectForVideo(v, t);
      const lm = r.faceLandmarks && r.faceLandmarks[0];
      if (!lm) return;
      let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
      for (const q of lm) { if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x; if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y; }
      face.x = (x0 + x1) / 2; face.y = (y0 + y1) / 2; face.size = x1 - x0; face.h = y1 - y0; face.seen = t;
      face.eyes = lm.length > 473 ? [lm[468], lm[473]] : null;   // #219: the two iris centres, to set "you in the dream" on our pupils
      const cats = r.faceBlendshapes && r.faceBlendshapes[0] ? r.faceBlendshapes[0].categories : [];
      const sc = n => (cats.find(c => c.categoryName === n) || {}).score || 0;
      face.smile = (sc('mouthSmileLeft') + sc('mouthSmileRight')) / 2;
      face.bs = Object.fromEntries(cats.map(c => [c.categoryName, c.score]));   // #162: the whole expression, for mirroring
    } catch (e) { /* a frame it could not read */ }
  }

  // ---------- #162, #218: Dreamy loves fire – flames on the camera: warm, bright light that flickers ----------
  // What is fire, how strong it is, where it is and what it does to them is worked out in static/dreamfire.js; here the
  // camera is sampled (about 15 times a second, so the gaze follows a flame within about 100 ms) and the eyes react.
  const FW = 96, FH = 72;
  const fire = Object.assign(DreamFire.sense(), { mind: DreamFire.mind(), tick: 0, glow: 0, blush: 0, flash: 0, awe: 0, longing: 0, from: null });
  // the camera picture is made small in two steps, the second one a clean halving: a sample pixel is a mean of what it
  // covers, so a lamp keeps its light when the phone is touched and the camera's noise in the dark passes less for flickering
  const fireCv = [2, 1].map(k => { const c = document.createElement('canvas'); c.width = FW * k; c.height = FH * k; return c.getContext('2d', { willReadFrequently: true }); });
  const enchanted = () => fire.on && fire.awe > 0.35;  // the fire has them – not once it only burns on in the background
  // the fire spirit may come through the pupils: freshly painted for this fire, and not again right away
  const spiritReady = t => !!aiFaces.flame && aiFaces.flame.at > fire.since - 60000 && t - fire.since > 5000 && t - (fire.spiritAt || -1e9) > 45000 && portal.phase === 'off' && !trance.on;
  function fireTick(t) {
    const v = $('cam');
    if (!v.videoWidth || t - fire.tick < 62) return;
    fire.tick = t;
    fireCv[0].drawImage(v, 0, 0, FW * 2, FH * 2);
    fireCv[1].drawImage(fireCv[0].canvas, 0, 0, FW, FH);
    const wasOn = fire.on, seen = face.seen && t - face.seen < 700;   // a face it has found: there, only very fiery light counts
    const sample = fireCv[1].getImageData(0, 0, FW, FH);
    DreamFire.look(fire, sample.data, FW, FH, t, seen ? { x: face.x, y: face.y, w: face.size, h: face.h } : null);
    if (fireSeen) fireShow(sample);
    DreamFire.think(fire.mind, fire, t, Math.random, { spirit: spiritReady(t) });
    if (fire.on && t - (fire.sent || 0) > 2000) { fire.sent = t; send({ fire: true }); }   // the Mac paints burning faces
    if (!fire.on && wasOn) fire.longing = t + 3000;
  }
  const DEBUG = new URLSearchParams(location.search).has('debug');   // ?debug in the address: for looking closely, and for the tests
  // #218: with ?debug, a corner shows what the fire detection makes of the camera: the sample in grey,
  // warm light in yellow (its bright core white), what counts as fire in red – and the numbers beside it
  const fireSeen = DEBUG ? document.createElement('canvas') : null;
  if (fireSeen) { fireSeen.width = FW; fireSeen.height = FH; }
  function fireShow(sample) {
    const d = sample.data, c = fire.cells, lit = c.blobs.map(b => b.lit);
    for (let p = 0, i = 0; p < FW * FH; p++, i += 4) {
      const k = c.k[p], grey = (d[i] + d[i + 1] + d[i + 2]) / 6;
      if (!(k > 0)) { d[i] = d[i + 1] = d[i + 2] = grey; continue; }
      const on = lit[c.id[p] - 1], core = k > 1, a = 0.35 + 0.65 * Math.min(1, core ? k - 1 : k);
      d[i] = 255; d[i + 1] = on ? (core ? 150 : 40) * a : (core ? 255 : 210) * a; d[i + 2] = core && !on ? 255 * a : 0;
    }
    fireSeen.getContext('2d').putImageData(sample, 0, 0);
    const b = c.blobs.slice().sort((p, q) => q.hits - p.hits)[0];
    fire.told = [`fire ${fire.on ? 'ON' : 'off'}   sure ${fire.sure.toFixed(2)} (on above 0.70)`, `strength ${fire.level.toFixed(2)}   fire light ${fire.e.toFixed(0)} px`,
      `warm patches ${c.blobs.length}${c.shift ? '   exposure shifts' : ''}`,
      b ? `best: ${b.e.toFixed(0)} px, core ${Math.round(100 * b.core / b.n)} %, jumps ${b.hits.toFixed(1)} (fire above 4)${b.even ? ', even beat' : ''}${b.torn ? ', torn' : ''}` : 'no warm light'];
  }
  function fireDraw() {                                // as the camera sees it (not mirrored)
    const s = Math.max(1.5, Math.min(3, W / 400)), x = 8, y = 8, w = FW * s, h = FH * s;
    g.save(); g.imageSmoothingEnabled = false; g.globalAlpha = 0.92; g.drawImage(fireSeen, x, y, w, h);
    g.strokeStyle = fire.on ? '#ff5030' : 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.strokeRect(x, y, w, h);
    g.font = '11px ui-monospace, Menlo, monospace'; g.textBaseline = 'top';
    (fire.told || ['waiting for the camera']).forEach((line, k) => { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x, y + h + 4 + k * 15, g.measureText(line).width + 8, 15); g.fillStyle = '#fff'; g.fillText(line, x + 4, y + h + 6 + k * 15); });
    g.restore();
  }
  // #218: the fire flares up (or catches): sparks fly in from where it is, the night glows for a moment, they startle
  function flareUp(t, k) {
    let vx = (0.5 - fire.x) * 2, vy = (fire.y - 0.5) * 2;   // the raw front camera sees the eyes' left on its right
    if (Math.hypot(vx, vy) < 0.2) { vx = 0; vy = 1; }        // right in front of them: from below
    const sc = 1 / Math.max(Math.abs(vx), Math.abs(vy)), ox = W / 2 + vx * sc * W / 2, oy = H / 2 + vy * sc * H / 2;
    fire.from = [ox, oy];
    const n = (perf > 45 ? 26 : perf > 30 ? 16 : 9) * (0.5 + 0.5 * k) * (0.35 + 0.65 * fire.level);   // a candle: a few sparks; much fire: a shower
    decor.push({ kind: 'sparks', x: ox, y: oy, dir: Math.atan2(H * 0.5 - oy, W / 2 - ox), born: t, life: 1300 + 500 * k, size: Math.hypot(W, H) * (0.35 + 0.35 * k), hue: 18, spin: 1,
      puffs: Array.from({ length: Math.round(n) }, () => [(Math.random() - 0.5) * 1.3, 0.35 + Math.random() * 0.65, Math.random()]) });
    st.wake = 1; feel('surprise', t, 700);
  }

  function camStop(why) {
    clearInterval(cam.timer); cam.lent = false;
    if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
    cam.stream = null; $('cam').srcObject = null;
    if (why) say(why, 0);
  }
  function announce() { if (cam.lent) { cam.wait = true; send({ feed: { cam: true, facing: 'user' } }); } }
  const frame = DreamCommon.cameraSender($('cam'), () => ctl, () => cam.lent);   // about 12 pictures a second
  function connect() {
    ctl = new WebSocket(`${proto}://${location.host}/ctl?role=remote&as=eyes`);   // #166: as the eyes, even on a Control device
    ctl.onopen = () => announce();
    ctl.onmessage = ev => {
      const m = JSON.parse(ev.data);
      measureMe(m);                                    // #180
      if (m.feeds_mine) { if (m.feeds_mine.includes('cam')) cam.wait = false; else if (cam.lent && !cam.wait) camStop(T('Dream Control took the camera back – tap to lend it again.')); }
      if (m.aimasks) {                                 // #160; #166: what the server dropped goes here too
        for (const k of Object.keys(aiFaces)) if (!(k in m.aimasks)) delete aiFaces[k];
        for (const [k, u] of Object.entries(m.aimasks)) aiFaceLoad(k, u);
      }
      if (typeof m.world === 'string') { DreamStyle.use(m.world); vis.mode = null; }   // #221: the style world to draw in – its own faces of light
      if (m.eyes_cfg) { trance.every = +m.eyes_cfg.trance_every || 0; tranceSchedule(performance.now(), true); }   // #172
      if (m.trance) tranceStart(performance.now());
      if (m.feed_taken === 'cam') camStop(T('Dream Control took the camera back – tap to lend it again.'));
    };
    ctl.onclose = ev => {
      if (ev.code === 4403) { camStop(T('No access – the code of Dreamy Eyes is no longer valid.')); return; }
      setTimeout(connect, 1500);
    };
  }

  // ---------- the eyes ----------
  let W = 0, H = 0, dpr = 1;
  // #188: when the phone runs short the eyes are drawn with fewer pixels (2 → 1.5 → 1 per CSS pixel), and with full
  // detail again once it keeps up; a step up that fails makes the next try wait longer, so it never see-saws
  const res = { cap: 2, at: 0, upAt: -1e9, upWait: 10000 };
  function resTick(t) {
    if (t - res.at < 2500) return;                     // give each step time to show in the frame rate
    if (perf < 40 && dpr > 1) {
      if (t - res.upAt < 15000) res.upWait = Math.min(120000, res.upWait * 2);
      res.cap = dpr > 1.5 ? 1.5 : 1; res.at = t; size();
    } else if (perf > 52 && dpr < Math.min(2, devicePixelRatio || 1) && t - res.at > res.upWait) {
      res.cap = res.cap < 1.5 ? 1.5 : 2; res.at = res.upAt = t; size();
    }
  }
  function size() {
    dpr = Math.min(2, res.cap, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    main.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', size); size();
  const fib = DreamEye.fibres();                       // #214, #221: the eye itself is drawn by the style world in use (static/dreamstyle.js)
  const st = { open: 0, openT: 1, pupil: 0.4, gx: 0, gy: 0, tx: 0, ty: 0, nextLook: 0, blinkAt: performance.now() + 2500, blink: 0, rot: 0, energy: 0, wake: 0 };
  const lerp = (a, b, k) => a + (b - a) * k;
  // #157: the eyes' look changes softly now and then – shade, liner, lashes, brows
  const { LOOKS, EMO } = DreamEye;
  const look = { name: 'rose', cur: { ...LOOKS.rose }, next: performance.now() + 90000 };
  function lookTick(t, dt) {
    if (t > look.next) { const o = Object.keys(LOOKS).filter(k => k !== look.name); look.name = o[Math.random() * o.length | 0]; look.next = t + 90000 + Math.random() * 90000; }
    const want = LOOKS[look.name], k = 1 - Math.exp(-dt * 0.8);   // about three seconds from one look to the next
    for (const key in want) {
      if (key === 'hue') { const d = ((want.hue - look.cur.hue + 540) % 360) - 180; look.cur.hue = (look.cur.hue + d * k + 360) % 360; }
      else look.cur[key] += (want[key] - look.cur[key]) * k;
    }
  }
  // ---------- #220: how much of a face shows – mostly only the eyes (static/dreamvis.js) ----------
  // Now and then hints come (the brows, the sign on the forehead of a face drawn in light), rarely – then clearly –
  // mouth, nose and outline. `?face=0|1|2` holds a level, to look at it. The rule is for what is drawn: the
  // faces painted by the AI and "you in the dream" stay whole.
  const vis = { seed: Math.random() * 0x7fffffff | 0, cur: DreamVis.EYES_ONLY, round: -1, mode: null, quiet: 1, calm: 1,
    hold: DreamVis.asked(location.search) };
  function visTick(t, dt) {
    // nothing of a face while something else takes the eyes' place; mouth and outline only while the eyes are calm
    const free = portal.phase === 'off' && !trance.on && you.moment < 0.05, calm = free && !enchanted() && st.energy < 0.6;
    vis.quiet = lerp(vis.quiet, free ? 1 : 0, 1 - Math.exp(-dt * 2)); vis.calm = lerp(vis.calm, calm ? 1 : 0, 1 - Math.exp(-dt * 1.2));
    vis.cur = DreamVis.damp(vis.hold >= 0 ? DreamVis.held(vis.hold) : DreamVis.at(t, vis.seed), vis.quiet, vis.quiet * vis.calm);
    const round = vis.hold >= 0 ? Math.floor(t / 20000) : vis.cur.round;   // (a held level: another face every 20 s)
    if (vis.cur.level && (vis.round !== round || !vis.mode)) {   // a new moment: another face, another feeling
      vis.round = round;
      const o = DreamStyle.face().MODES.filter(k => k !== vis.mode); vis.mode = o[Math.random() * o.length | 0];
      brow.idle = dream.lum < 0.3 && st.energy > 0.45 && Math.random() < 0.4 ? 'frown' : ['curious', 'doubt', 'joy', 'sad'][Math.random() * 4 | 0];   // frowning only in a dark, wild dream
    }
  }
  // #157: the brows show a feeling – surprise, joy, sadness, doubt, a frown, curiosity. #220: they come only with the
  // hints; what is felt then decides their shape, not whether they are there
  const brow = { emo: null, idle: 'curious', until: 0, mirrorWant: [{ inner: 0, peak: 0, outer: 0 }, { inner: 0, peak: 0, outer: 0 }], cur: [{ inner: 0, peak: 0, outer: 0 }, { inner: 0, peak: 0, outer: 0 }], lastEnergy: 0 };
  function feel(emo, t, ms) { if (brow.emo !== emo || t > brow.until - 400) { brow.emo = emo; brow.until = t + ms; } else brow.until = Math.max(brow.until, t + ms); }
  function browTick(t, dt, present) {
    // what calls for a feeling right now
    if (fx.surprise > t || (present && face.size > 0.45)) feel('surprise', t, 1800);
    else if (present && face.smile > 0.45) feel('joy', t, 1200);   // someone smiles at them
    else if (fx.mood === 'tear') feel('sad', t, 3200);
    else if (fx.mood === 'cross') feel('doubt', t, 1800);
    else if (t > 12000 && t > (brow.spikeAt || 0) && st.energy > 0.45 && st.energy - brow.lastEnergy > 0.2) {   // the dream suddenly gets wild
      feel('surprise', t, 1600); brow.spikeAt = t + 15000;
    }
    if (mirror.on) {                                   // #162: while mirroring, the brows copy the person's

    const tt = tranceTick(t, dt, present);              // #172
    if (tt >= 0) {                                     // in trance: calm, half closed – then closed while the third eye is open

    if (present) {

      st.tx = Math.max(-1, Math.min(1, (0.5 - face.x) * 2.4)) * 0.85 + (Math.random() < 0.02 ? (Math.random() - 0.5) * 0.15 : 0);
      st.ty = Math.max(-1, Math.min(1, (face.y - 0.45) * 2.2)) * 0.6;
      if (!st.watching) { st.watching = true; st.wake = Math.max(st.wake, 0.45); }   // someone came: the eyes open up

        st.nextLook = t + 1200 + Math.random() * (3500 - 2500 * st.energy);

    const fm = fire.on ? fire.mind.mood : null;
    fire.flash = fire.on && fire.flare ? fire.flare.k * Math.exp(-(t - fire.flare.at) / 450) : 0;
    fire.awe = fire.on ? Math.max(1 - fire.mind.habit, Math.min(1, fire.flash * 1.5)) : 0;
    if (fire.on && fire.flare.at !== fire.flareShown) { fire.flareShown = fire.flare.at; flareUp(t, fire.flare.k); }
    const held = enchanted();
    if (held) {                                        // they cannot take their eyes off it: the gaze is where the flame is
      st.tx = Math.max(-1, Math.min(1, (0.5 - fire.x) * 2.4)) * 0.85; st.ty = Math.max(-1, Math.min(1, (fire.y - 0.45) * 2.2)) * 0.6;
      st.nextLook = t + 600; fx.mood = null;
      st.wake = Math.max(st.wake, (0.3 + 0.55 * fire.level) * fire.awe);
      if (t - fire.flare.at > 700 && fire.trend > -0.06) {

    }
    if (fire.on && t > (fire.emberAt || 0)) {          // embers rise on the flame's side, the more the stronger it burns – and little burning hearts when in love
      const rate = fire.level * (0.25 + 0.75 * fire.awe) * (fm === 'dream' ? 0.5 : 1);
      fire.emberAt = t + (perf > 30 ? 140 : 280) / Math.max(0.12, rate);
      const heart = held && Math.random() < (fm === 'love' ? 0.45 : 0.06);
      decor.push({ kind: heart ? 'fireheart' : 'ember', x: W * Math.max(0.05, Math.min(0.95, 1 - fire.x + (Math.random() - 0.5) * 0.9)), y: H * (0.85 + Math.random() * 0.2), born: t, life: 2600 + Math.random() * 1600,
        size: Math.min(W, H) * (heart ? 0.05 : 0.012) * (0.6 + Math.random() * 0.8), hue: 10 + Math.random() * 35, spin: Math.random() - 0.5, puffs: [] });
    }
    if (!fire.on && t < fire.longing) feel('sad', t, 600);   // the fire is gone – a moment of longing
    if (t < touch.lookUntil) {                         // #162: they look at the finger
      st.tx = Math.max(-1, Math.min(1, (touch.x - W / 2) / (W * 0.33)));
      st.ty = Math.max(-1, Math.min(1, (touch.y - H * 0.5) / (H * 0.4)));
      st.nextLook = t + 600;
    }
    if (!touch.pts.size) touch.pupilK = lerp(touch.pupilK, 1, 1 - Math.exp(-dt * 1.5));
    if (tt >= 0 && tt < 15800) { st.tx = 0; st.ty = -0.25; st.nextLook = t + 600; }   // #172: inward, upward
    moods(t, dt, present);
    lookTick(t, dt);
    visTick(t, dt);
    browTick(t, dt, present);
    const k = 1 - Math.exp(-dt * (held ? (fm === 'dream' ? 5 : 26) : 9));   // #218: on a flame at once – dreaming, they drift after it
    st.gx = lerp(st.gx, st.tx, k); st.gy = lerp(st.gy, st.ty, k);
    // blinking, now and then (sometimes twice)

      const p = (t - st.blinkAt) / 170;

      if (p >= 1) { st.blink = 0; st.blinkAt = t + (Math.random() < 0.15 ? 260 : 2200 + Math.random() * 4500); }
    }
    // the night around them, breathing in the dream's colour
    g.fillStyle = '#07060b'; g.fillRect(0, 0, W, H);
    const [r, gg, b] = dream.col, breath = 0.5 + 0.5 * Math.sin(t / 2600);
    const bg = g.createRadialGradient(W / 2, H * 0.48, 0, W / 2, H * 0.48, Math.max(W, H) * 0.75);
    bg.addColorStop(0, `rgba(${r | 0},${gg | 0},${b | 0},${0.1 + 0.08 * breath})`); bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    drawBack(t);

    const vg = g.createRadialGradient(W / 2, H * 0.47, 0, W / 2, H * 0.47, Math.max(W, H) * 0.5);
    const vd = 1 - 0.55 * bs.reveal;                   // while the dream window is open, less darkness behind the eyes
    vg.addColorStop(0, `rgba(7,6,11,${0.4 * vd})`); vg.addColorStop(0.45, `rgba(7,6,11,${0.1 * vd})`); vg.addColorStop(1, 'rgba(7,6,11,0)');

    const glowT = fire.on ? Math.min(1.15, (0.3 + 0.7 * fire.level) * (0.4 + 0.6 * fire.awe) + 0.3 * fire.flash) : 0;

        size: Math.min(W, H) * (0.025 + 0.03 * bl) * (0.7 + Math.random() * 0.6), hue: 325 + Math.random() * 30, spin: Math.random() - 0.5, puffs: [] });
    }

    if (blush > 0.01) for (const sd of [-1, 1]) {   // #162: a warm blush under the eyes

      gr.addColorStop(0, `rgba(255,130,165,${0.55 * blush})`); gr.addColorStop(0.6, `rgba(255,110,150,${0.2 * blush})`); gr.addColorStop(1, 'rgba(255,110,150,0)');

      let hint = bl > 0.45 ? (bl - 0.45) / 0.55 : 0;    // about 4.5 s on) and now and then for a moment by itself, as a shimmer
      if (t > trance.glimNext) { if (!enchanted()) trance.glimT0 = t;   // asleep too: it dreams

      trance.hint = hint;
      if (hint > 0.01) {

  }
  requestAnimationFrame(draw);

  // ---------- start: one tap opens the eyes (fullscreen – not with ?debug –, screen stays on, camera lent) ----------
  const keepAwake = DreamCommon.wakeLock(false);       // the screen stays on (where the browser grants it)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  async function start() {
    $('start').classList.add('gone'); $('note').classList.remove('on');
    st.wake = 0.6;
    if (!DEBUG) try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) { /* not offered */ }   // (with ?debug the page stays a window)

  // ---------- #162: touch – they look at the finger, flinch when poked, purr when petted, bloom where you tap ----------
  const touch = { pts: new Map(), x: 0, y: 0, lookUntil: 0, poke: [-1e9, -1e9], pokes: [], crossUntil: 0, loveUntil: 0, stroke: 0, bliss: 0, blissAt: 0, heartAt: 0, ripples: [],
    pupilK: 1, pinch0: 0, k0: 1, lastTap: 0, sparkAt: 0 };

    for (const sd of [0, 1]) { const [cx, cy, a] = eyesAt[sd]; if (Math.abs(x - cx) < a * 0.95 && Math.abs(y - cy) < a * 0.55) return sd; }

    touch.pts.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: now, moved: 0, lt: now });
