<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream · Output</title>
<link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  img { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; opacity: 0; }   /* the cross-fade: gl-stage.js */
  #pics { transition: opacity .12s linear; }           /* master brightness (Canvas 2D drawing; the WebGL chain fades itself) */
  /* autopilot effects on driving music (sent by the stage): kaleidoscope over the picture, pulse and flash on the beat */
  #fxcv { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; opacity: 0; pointer-events: none; }
  #smoothcv, #glcv { position: fixed; left: 0; top: 0; display: none; pointer-events: none; }
  #glcv { width: 100vw; height: 100vh; }             /* the WebGL 2 chain draws the whole window (gl-stage.js) */
  #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px;
    background: rgba(20, 18, 30, .8); color: #ece8f6; font: 14px/1.4 -apple-system, system-ui, sans-serif;
    transition: opacity .6s; }
  body.live #hint { opacity: 0; }
  /* calibration (#92): black, one white point where the stage asks for it */
  #calib { position: fixed; inset: 0; background: #000; z-index: 10; }
  #calib i { position: absolute; width: 6vmin; height: 6vmin; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
</style>
<script src="/static/common.js" data-hide-key></script><!-- #175: the key stays in the cookie, not in the address bar; and what the pages share -->
</head>
<body>
<div id="pics"><img id="a" alt=""><img id="b" alt=""><canvas id="smoothcv" aria-hidden="true"></canvas><canvas id="fxcv" aria-hidden="true"></canvas><canvas id="glcv" aria-hidden="true"></canvas></div>
<div id="calib" hidden><i hidden></i></div>
<div id="hint" role="status">Dream · output – waiting for pictures (the stage or panel must be open). Tap or F = fullscreen</div>
<script src="/static/i18n.js"></script>
<script src="/static/morph.js"></script>
<script src="/static/fx.js"></script>
<script src="/static/gl-stage.js"></script>
<script>
  const T = I18N.t;   // #132
  I18N.apply();
// Output window for a beamer or second monitor: shows exactly what the stage shows, renders nothing itself.
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let front = $('a'), back = $('b'), lastT = 0, hideHint = null, nextFade = 0, nextMorph = null;
  let nextFlow = null, nextN = 0, shownN = 0;         // #205: the flow field for the next picture, and which picture that is
  // #204: one chain draws the pictures, their motion (#194), the smoothing and the effects as the stage shows them –
  // on the graphics card, or with Canvas 2D without WebGL 2. The effects fade out by themselves if the stage stops
  // sending (closed, switched off).
  const view = DreamStage.create({ box: $('pics'), a: $('a'), b: $('b'), smooth: $('smoothcv'), fx: $('fxcv'), gl: $('glcv'), contain: true });
  let fx = null, fxAt = 0, smoothTau = 0, master = 1, drawnAt = performance.now();
  (function frame() {
    const now = performance.now(), dt = Math.min(0.1, (now - drawnAt) / 1000), f = fx && now - fxAt <= 1000 ? fx : null;
    const k = f ? Math.max(0, Math.min(1, +f.k || 0)) : 0;
    drawnAt = now;
    view.draw({ front, now, dt, tau: smoothTau, fx: k > 0.005 ? f : null, k, sc: f ? +f.sc || 1 : 1, br: f ? +f.br || 1 : 1, sat: 1, master });
    requestAnimationFrame(frame);
  })();
  // #205: the flow field as the stage passes it on ({cols, rows, k, data: the vectors' bytes as base64}); null if it is not one
  function flowField(f) {
    if (!f || typeof f !== 'object' || typeof f.data !== 'string' || f.data.length > 8000) return null;
    try {
      const bytes = Uint8Array.from(atob(f.data), c => c.charCodeAt(0)), cols = +f.cols | 0, rows = +f.rows | 0;
      if (cols < 2 || rows < 2 || bytes.length !== cols * rows * 2) return null;
      return { cols, rows, k: Math.max(0, Math.min(1, +f.k || 0)), data: new Int8Array(bytes.buffer) };
    } catch (e) { return null; }
  }
  const WAIT = $('hint').textContent;
  const hint = t => { $('hint').textContent = t; document.body.classList.remove('live'); };
  function connect() {
    // the key from the QR code comes along as a cookie (set by the first page request); on a second device in the WLAN
    // a lost connection (WLAN gap, Dream restarted) reconnects by itself
    const ws = new WebSocket(`ws://${location.host}/view`);
    ws.onopen = () => { if ($('hint').textContent !== WAIT) hint(WAIT); };
    ws.binaryType = 'blob';
    // the calibration point in the picture's coordinates: where the picture lies in this window (letterboxed)
    function showCalib(c) {
      const box = $('calib'), dot = box.firstElementChild;
      box.hidden = !c; if (!c) return;
      dot.hidden = c.x == null; if (c.x == null) return;
      const iw = front.naturalWidth || 1, ih = front.naturalHeight || 1, W = innerWidth, H = innerHeight, s = Math.min(W / iw, H / ih);
      dot.style.left = ((W - iw * s) / 2 + c.x * iw * s) + 'px'; dot.style.top = ((H - ih * s) / 2 + c.y * ih * s) + 'px';
    }
    ws.onmessage = ev => {
      if (typeof ev.data === 'string') {                 // master brightness from the stage's fader, slow fade at a model switch
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }   // a broken message: skip it
        if ('master' in m) master = Math.max(0, Math.min(1, +m.master || 0));
        if (m.fade) nextFade = Math.min(4000, +m.fade);
        if ('morph' in m) {                              // #194: the motion for the next picture, #205: and its flow field
          nextMorph = m.morph && typeof m.morph === 'object' ? m.morph : null;
          nextN = +m.n || 0; nextFlow = flowField(m.flow);
        }
        if (m.fx) { fx = m.fx; fxAt = performance.now(); }
        if ('smooth' in m) smoothTau = +m.smooth || 0;         // smoothing as on the stage (seconds)
        if ('calib' in m) showCalib(m.calib);
        return;
      }
      const url = URL.createObjectURL(ev.data), img = back, n = nextN, flow = nextFlow;   // as announced for this picture
      nextFlow = null;
      img.onload = () => {
        const t = performance.now(), dt = lastT ? t - lastT : 400; lastT = t;
        // cross-fade over most of the time until the next picture: smooth even at 2–3 pictures per second
        const fxk = fx && performance.now() - fxAt < 1000 ? +fx.k || 0 : 0;    // stage effects on: snappier, like the stage
        const fade = nextFade || Math.round(Math.min(900, dt * 0.9) * (1 - 0.9 * fxk)); nextFade = 0;
        const old = front; front = img; back = old;
        // #205: the field leads from the picture before to this one – only if this window showed that one (the line
        // may leave a picture out), otherwise the two cross-fade
        view.show(front, { fade, flow: n === shownN + 1 ? flow : null });
        shownN = n;
        DreamFx.morph.show(front, back, nextMorph, performance.now());   // #194, #215: it joins the motion like on the stage
        setTimeout(() => { if (back.src.startsWith('blob:')) URL.revokeObjectURL(back.src); }, 1500);
        document.body.classList.add('live');
        clearTimeout(hideHint);
        hideHint = setTimeout(() => document.body.classList.remove('live'), 5000);   // no pictures for 5 s: hint again
      };
      img.src = url;
    };
    ws.onclose = async () => {
      // the browser does not tell why; a page request does (403 = the key is not valid any more)
      const r = await fetch('/remote-info', { cache: 'no-store' }).catch(() => null);
      if (r && r.status === 403) { hint(T('No access – scan the QR code in Dream (Output → “Output over Wi-Fi”) again.')); setTimeout(connect, 10000); return; }
      hint(T('Connection to Dream lost – reconnecting …'));
      setTimeout(connect, 1500);
    };
  }
  connect();
  const full = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') full(); });
  // a tap (TV box, tablet) or click goes full screen; a double click leaves it again
  let fullAt = 0;
  addEventListener('click', () => { if (!document.fullscreenElement && document.documentElement.requestFullscreen) { fullAt = Date.now(); full(); } });
  addEventListener('dblclick', () => { if (document.fullscreenElement && Date.now() - fullAt > 600) full(); });
})();
</script>
</body>
</html>
