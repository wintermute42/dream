<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dream · Window</title>
<link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<style>
  /* #201, #214: a dream window – an old phone or tablet. One large, living motif, the dream around it as drifting clouds */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 10px; background: rgba(20, 18, 30, .78); color: #ece8f6;
    font: 14px/1.4 -apple-system, system-ui, sans-serif; text-align: center; transition: opacity .8s; max-width: 86vw; }
  body.live #hint { opacity: 0; pointer-events: none; }
</style>
<script src="/static/common.js" data-hide-key></script><!-- #175: the key stays in the cookie, not in the address bar; and what the pages share -->
<script src="/static/i18n.js"></script>
<script src="/static/dreambrush.js"></script>
<script src="/static/dreamvis.js"></script>
<script src="/static/dreamlife.js"></script>
<script src="/static/dreameye.js"></script>
<script src="/static/dreamstyle.js"></script>
<script src="/static/world-classic.js"></script>
<script src="/static/world-deepsea.js"></script>
<script src="/static/world-ink.js"></script>
<script src="/static/world-etching.js"></script>
<script src="/static/world-aurora.js"></script>
<script src="/static/dreamface.js"></script>
</head>
<body>
<canvas id="cv" aria-label="A window to the dream"></canvas>
<div id="hint" role="status">Connecting to the dream … Tap for fullscreen.</div>
<script>
(() => {
  'use strict';
  const T = (window.I18N && I18N.t) || (s => s);
  if (window.I18N && I18N.apply) I18N.apply();
  const $ = id => document.getElementById(id);
  const cv = $('cv'), main = cv.getContext('2d');
  // #224: while two style worlds are crossfaded the frame is drawn once per world – the first into the page, the
  // second into a layer – and the two are added up by their weights; `g` is where the pass in hand draws
  let g = main;
  const mix = { cv: document.createElement('canvas'), told: false, pair: false, hold: new URLSearchParams(location.search).get('blend') };
  mix.g = mix.cv.getContext('2d');
  // #221: the brushes every style world shares (static/dreambrush.js); what is drawn comes from the world in use
  const { lerp, clamp, canvas, rng, hash, hueOf, cover, night } = DreamBrush;
  const ease = x => x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2;
  const { SCALE } = DreamLife;
  // ---------- what Dream tells this window ----------
  const st = { index: 0, of: 1, pulse: 0, master: 1, wave: -1e9, blush: -1e9, trance: -1e9, ahead: 0 };
  const now = () => Date.now() + st.ahead;             // Dream's clock: all windows breathe, look and blink by it
  const dream = { cur: null, prev: null, at: 0, col: [120, 90, 170], lum: 0.4 };
  const faces = { urls: [], set: {}, marks: {} };      // the painted faces: their pictures, and where each has its eyes, brows, mouth
  const life = [];                                     // the small beings in this window right now
  const motif = { cur: null, next: null };             // the one large motif, and what forms once it has dissolved
  const MOTIFS = new Set(['eye', 'pair', 'face', ...DreamStyle.motifs()]);   // the page's own and the style world's
  const FORM = 4000;                                   // ms a motif takes to form out of clouds, or to dissolve into them
  const small = canvas(8), smallG = small.getContext('2d', { willReadFrequently: true });
  function analyse(img) {                              // the dream's colour and brightness, from an 8×8 copy
    smallG.drawImage(img, 0, 0, 8, 8);
    Object.assign(dream, DreamBrush.brightness(smallG.getImageData(0, 0, 8, 8).data, 8, 8));   // col, lum, L(u, v)
  }
  const KINDS = new Set(['cloud', 'moth', 'bubbles', 'aurora']);
  const EDGES = new Set(['left', 'right', 'top', 'bottom']);
  function sow(m, t) {                                 // a seed from Dream: a small being of light drifts through
    if (!m || !KINDS.has(m.kind) || !EDGES.has(m.enter) || !EDGES.has(m.exit)) return;
    if (life.length >= room()) return;                 // a weak device shows fewer at once
    const r = rng(+m.seed || 1);
    life.push({ kind: m.kind, enter: m.enter, exit: m.exit, born: t,
      life: clamp(+m.life || 10, 3, 30) * 1000, hueOff: clamp(+m.hue || 0, -90, 90), sizeK: clamp(+m.size || 1, 0.5, 1.5),
      u: [r(), r(), r(), r()], spin: (r() < 0.5 ? -1 : 1) * (0.5 + r()), puffs: Array.from({ length: 7 }, () => [r() - 0.5, r() - 0.5, 0.35 + r() * 0.45]),
      wob: r() * 6.28 });
  }
  // #220: how much of a drawn face shows (static/dreamvis.js) – of the large eye: its brow only with the hints; by
  // Dream's clock and the motif's seed, so the two eyes of a pair raise their brows together. `?face=0|1|2` holds a
  // level, to look at it. A face painted by the AI stays whole.
  const faceHold = DreamVis.asked(location.search);
  const visOf = seed => faceHold >= 0 ? DreamVis.held(faceHold) : DreamVis.at(now(), seed);
  const FACE_URL = /^\/eyes\/mask\/[0-9a-f]{12}\.jpg$/;
  function show(m, t) {                                // Dream says what this window shows: the old motif dissolves, then this one forms
    if (!m || !MOTIFS.has(m.kind)) return;
    if (m.kind === 'face' && !FACE_URL.test(m.face)) return;
    if (Number.isFinite(+m.now)) st.ahead = +m.now - Date.now();
    const cur = motif.cur;
    if (cur && !cur.left) cur.left = t - (1 - Math.min(1, (t - cur.born) / FORM)) * FORM;   // half formed: it dissolves from there
    motif.next = { kind: m.kind, seed: (+m.seed || 1) >>> 0, half: m.half === 1 ? 1 : m.half === 0 ? 0 : null, face: m.face || null,

  }
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/view?as=window`);
    ws.binaryType = 'blob';
    ws.onopen = () => { $('hint').textContent = T('Connected – tap for fullscreen.'); };

        return;

      if (m.motif) show(m.motif, t);
      if (m.life) sow(m.life, t);
      if (m.wave) st.wave = t + (+m.wave.index || 0) * 320;   // a wave reaches this window in its turn
      if (m.mood && m.mood.kind === 'trance') st.trance = t;
      if (m.mood && m.mood.kind === 'blush') st.blush = t + (+m.mood.index || 0) * 300;
      if (m.fx) st.pulse = Math.max(st.pulse, clamp(+m.fx.pulse || 0, 0, 1) * clamp(+m.fx.k || 0, 0, 1) + clamp(+m.fx.bass || 0, 0, 1) * 0.3);
      if ('pulse' in m) st.pulse = Math.max(st.pulse, clamp(+m.pulse || 0, 0, 1));

      }
      if (m.marks && typeof m.marks === 'object') {    // where a painted face has its eyes, brows and mouth – found once, on Dream's Mac
        for (const [id, pts] of Object.entries(m.marks)) if (/^[0-9a-f]{12}$/.test(id) && Array.isArray(pts) && pts.length === 2 * DreamFace.PICK.length) faces.marks[id] = pts;
        for (const id of Object.keys(faces.marks)) if (!faces.urls.some(u => u.includes(id)) && !(motif.cur && motif.cur.face && motif.cur.face.includes(id))) delete faces.marks[id];
      }
    };
    ws.onclose = ev => {
      if (ev.code === 4403) { document.body.classList.remove('live'); $('hint').textContent = T('No access – scan the code of the dream windows in Dream again.'); return; }
      setTimeout(connect, 2000);
    };
  }
  // ---------- screen, fullscreen, staying awake ----------
  // a weak device draws with fewer pixels (res) and less detail (tier: 2 all of it, 1 less, 0 the least) until it keeps up
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), res = 1, slowSince = 0, fastSince = 0;
  const STEPS = [1, 0.75, 0.5, 0.36];                  // pixels per pixel of the screen, step by step
  const tier = () => res >= 1 ? 2 : res >= 0.75 ? 1 : 0;
  const layer = canvas(2), lg = layer.getContext('2d');   // a motif that forms, dissolves or dims is drawn here first
  function size() {
    W = innerWidth; H = innerHeight;
    const k = dpr * res; cv.width = Math.round(W * k); cv.height = Math.round(H * k); main.setTransform(k, 0, 0, k, 0, 0);
  }
  addEventListener('resize', size); size();
  const keepAwake = DreamCommon.wakeLock(true);        // the screen stays on (over http: a tiny silent video)
  addEventListener('click', () => {
    keepAwake();
    const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
    if (fs && !document.fullscreenElement && !document.webkitFullscreenElement) { try { fs.call(d); } catch (e) { /* not on this device */ } }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  // ---------- the dream's picture ----------
  function dreamPic(c, x, y, w, h, zoom, cx, cy) {     // the dream with a soft crossfade to each new picture
    if (!dream.cur) return;
    const k = clamp((performance.now() - dream.at) / 700, 0, 1), a0 = c.globalAlpha;
    if (dream.prev && k < 1) cover(c, dream.prev, x, y, w, h, zoom, cx, cy);
    c.globalAlpha = a0 * k; cover(c, dream.cur, x, y, w, h, zoom, cx, cy); c.globalAlpha = a0;
  }
  // the motifs take the dream from a small square copy, made once per frame: an iris, the faces of an impossible shape
  // and the folds of a mandala draw it many times over
  const pic = canvas(256), picG = pic.getContext('2d');
  function picTick() {
    const n = tier() > 1 ? 384 : 256;
    if (pic.width !== n) pic.width = pic.height = n;
    picG.globalAlpha = 1;
    if (dream.cur) dreamPic(picG, 0, 0, n, n, 1, 0.5, 0.5); else { picG.fillStyle = '#0a0812'; picG.fillRect(0, 0, n, n); }
  }
  // ---------- #214: clouds. Noise that repeats at its edges, made once; the dream is seen through fields of it ----------
  // #222: the fields of cloud and how they are laid out are the brushes' (static/dreambrush.js); the sky itself – the
  // dream seen through them – is drawn by the style world (the part `sky`). What a motif dissolves into stays here.
  const { tile, clouds: cloudField } = DreamBrush;
  const EATEN = Array.from({ length: 7 }, (_, i) => cloudField(37, 1 - i / 6, 0.1));   // from whole (0) to gone (6): a motif dissolving
  const FRINGE = cloudField(23, 0.6, 0.2);
  const cl = canvas(2), cg = cl.getContext('2d'), mk = canvas(2), mg = mk.getContext('2d');
  const drift = Math.random() * 50;                    // every window has its own piece of the sky
  let cloudAt = -1e9, cloudOf = '';                    // (#224: and never another world's sky)
  function clouds(t, breath) {                         // the dream, seen through drifting fields of cloud, darkness between
    const q = [0.16, 0.24, 0.32][tier()] * Math.min(1.5, dpr), w = Math.max(48, Math.round(W * q)), h = Math.max(48, Math.round(H * q));
    const resized = cl.width !== w || cl.height !== h;
    if (resized) { cl.width = mk.width = w; cl.height = mk.height = h; }
    if (!resized && tier() === 0 && t - cloudAt < 30 && cloudOf === DreamStyle.name) return;   // the weakest: every other frame is enough, clouds are slow
    cloudAt = t; cloudOf = DreamStyle.name;
    cg.setTransform(1, 0, 0, 1, 0, 0); cg.globalCompositeOperation = 'source-over'; cg.globalAlpha = 1; cg.clearRect(0, 0, w, h);
    DreamStyle.part('sky').clouds(cg, t, { w, h, tier: tier(), swell: clamp(0.25 + 0.5 * breath + 0.6 * st.pulse, 0, 1), drift, index: st.index, pulse: st.pulse,
      dream: (c, x, y, pw, ph, zoom, cx, cy) => { if (dream.cur) dreamPic(c, x, y, pw, ph, zoom, cx, cy); else { c.fillStyle = '#17122a'; c.fillRect(x, y, pw, ph); } } });
  }
  // ---------- drawing helpers ----------
  // a soft-edged round piece (a mandala of the dream): drawn small off screen, its edge dissolved once by a soft light
  const soft = canvas(2), sg = soft.getContext('2d');
  let EDGE = null, softAt = -1e9, softOf = '';
  function softPiece(c, t, paint, x, y, r, al) {
    const n = [192, 256, 384][tier()], fresh = soft.width !== n;
    if (fresh) { soft.width = soft.height = n; EDGE = DreamBrush.softLight([[0, 'rgba(0,0,0,1)'], [0.7, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']], n); }
    if (fresh || softOf !== DreamStyle.name || t - softAt >= [70, 30, 0][tier()]) {   // it turns slowly: a weak device paints it less often
      softAt = t; softOf = DreamStyle.name;
      sg.globalCompositeOperation = 'source-over'; sg.globalAlpha = 1; sg.clearRect(0, 0, n, n);
      paint(sg, n);
      sg.globalCompositeOperation = 'destination-in'; sg.drawImage(EDGE, 0, 0);
    }
    c.globalAlpha = al; c.drawImage(soft, x - r, y - r, r * 2, r * 2); c.globalAlpha = 1;
  }
  // ---------- the motifs. Each is drawn into c around the window's middle; m is what Dream said, with its own memory ----------
  const mid = t => [W / 2 + Math.sin(t / 7100) * W * 0.012, H / 2 + Math.cos(t / 9300) * H * 0.012];   // it floats a little
  // --- the large eye: the very eye of Dreamy Eyes (static/dreameye.js). When it looks where and when it blinks follows
  // from its seed and Dream's clock, so the two eyes of a pair in two windows look and blink together
  const fib = DreamEye.fibres(), irisStars = DreamEye.stars();
  const LOOKS = Object.values(DreamEye.LOOKS), FEEL = Object.values(DreamEye.EMO), IRIS = ['dream', 'kaleido', 'vortex', 'galaxy'];
  const flick = DreamFace.flick;                       // a lid closing and opening
  function eyeLife(m, dt, calm) {
    const e = m.e || (m.e = { gx: 0, gy: 0, open: 0.1, pupil: 0.4, blink: 0, browAl: 0, brow: { inner: 0, peak: 0, outer: 0 } });
    const clk = now(), s = m.seed, k = Math.floor(clk / 2600);
    const straight = hash(s, k + 9000) < 0.3;          // now and then straight at whoever stands in front
    const kk = 1 - Math.exp(-dt * 9);
    e.gx = lerp(e.gx, straight ? 0 : (hash(s, k) * 2 - 1) * 0.8, kk); e.gy = lerp(e.gy, straight ? 0 : (hash(s, k + 5000) * 2 - 1) * 0.5, kk);
    const b = Math.floor(clk / 3400), ph = clk - b * 3400 - hash(s, b + 31000) * 2600;
    e.blink = Math.max(flick(ph / 170), hash(s, b + 32000) < 0.18 ? flick((ph - 430) / 170) : 0);   // sometimes twice
    e.open = lerp(e.open, calm ? 0.5 : 0.82 + 0.18 * st.pulse, 1 - Math.exp(-dt * 2.5));
    e.pupil = lerp(e.pupil, 0.54 - 0.3 * dream.lum + 0.1 * st.pulse, 1 - Math.exp(-dt * 1.6));   // wide in a dark dream, and with the beat
    e.rot = (clk % 1e8) / 14000;
    const w = Math.floor(clk / 28000);                 // the iris is a world of its own that changes now and then
    e.iris = IRIS[hash(s, w + 41000) * 4 | 0]; e.irisPrev = IRIS[hash(s, w + 40999) * 4 | 0]; e.irisMix = Math.min(1, (clk - w * 28000) / 2500);
    const h = Math.floor(clk / 47000), hp = (clk - h * 47000) / 5000;   // #218: rarely (one slot in ten) the pupil hypnotises for a moment
    e.hyp = DreamEye.hypnoAt(h, s); e.hypMix = hash(s, h + 61000) < 0.1 && hp < 1 ? clamp(Math.min(hp, 1 - hp) * 9, 0, 1) : 0; e.clk = clk;
    const v = visOf(s), want = FEEL[hash(s, v.round + 52000) * FEEL.length | 0][m.mirror ? 1 : 0];   // #220: the brow comes with the hints, each time with a feeling
    e.browAl = DreamVis.of(v, 'brows'); e.creaseAl = DreamVis.of(v, 'crease');
    for (const key in e.brow) e.brow[key] = lerp(e.brow[key], v.level ? want[key] : 0, 1 - Math.exp(-dt * 8));
    return e;
  }
  function eyeDraw(c, m, e, cx, cy, a, look) {
    const o = { rot: e.rot, hue: hueOf(dream.col), stars: irisStars, pic: (x, y, n, al) => { c.globalAlpha = al; c.drawImage(pic, x - n / 2, y - n / 2, n, n); } };
    const style = DreamStyle.eye();                    // #221: the eye of the style world in use
    style.draw(c, cx, cy, a, a * 0.56, m.mirror, { open: e.open, blink: e.blink, squint: 0, col: dream.col, energy: 0.3 + 0.5 * st.pulse,
      look, brow: e.brow, browAl: e.browAl, crease: e.creaseAl, fib, gx: e.gx, gy: e.gy, pupil: e.pupil, pupilMix: e.hypMix,
      pupilShape: (ix, iy, pr, R) => style.pupilShape(c, e.hyp, ix, iy, pr, R, m.mirror, { hue: o.hue, beat: st.pulse, now: e.clk }),
      iris: (ix, iy, R) => {
        for (const [world, al] of [[e.irisPrev, 1 - e.irisMix], [e.iris, e.irisMix]]) if (al > 0.01) style.irisWorld(c, world, ix, iy, R, m.mirror, al, o);

  function drawEye(c, m, t, dt) {

    const [cx, cy] = mid(t), a = Math.min(W * 0.38, H * 0.5) * (1 + 0.02 * st.pulse);

  // --- a painted face, alive: its points come with it (found once on Dream's Mac); this window moves them (blink, look,
  // smile, brows, a slight turn) and draws the moved net of triangles. Without points the face is shown still.
  const fringe = canvas(2), fg = fringe.getContext('2d');
  function faceEdge(n, mx, my, t) {                    // the face's edge: whole in the middle, torn into cloud around – no square

  function faceLife(m, t, dt) {                        // what the face does next: by itself, with the beat, with Dreamy Eyes

  function faceOf(url) {

  function drawFace(c, m, t, dt) {
    const f = faceOf(m.face);
    if (!f.img.complete || !f.img.naturalWidth) return;

    if (!f.net || f.net.size !== n || !!pts !== f.alive) {   // its net: made once (again when its points arrive, or for fewer pixels)

    }
    const net = f.net, e = faceLife(m, t, dt);

      f.at = t;

    }

    const side = Math.min(H * 1.3, W * 1.55) * (1 + 0.012 * breath + 0.02 * st.pulse), hue = hueOf(dream.col);

    halo.addColorStop(0, `hsla(${hue},85%,60%,.22)`); halo.addColorStop(1, `hsla(${hue + 40},85%,60%,0)`);

  // #221: the eye and the painted face are the page's own (the eye is drawn by the style world, the face is a picture);
  // every other motif is the style world's. `kit` is what the window hands a world's motif.
  const DRAW = { eye: drawEye, pair: drawEye, face: drawFace };
  const kit = { softPiece, pic, eye: (c, m, dt, x, y, a, look) => eyeDraw(c, m, eyeLife(m, dt, false), x, y, a, look) };
  function drawKind(c, m, t, dt) {
    if (DRAW[m.kind]) return DRAW[m.kind](c, m, t, dt);
    Object.assign(kit, { W, H, mid: mid(t), pulse: st.pulse, hue: hueOf(dream.col), tier: tier() });
    DreamStyle.motif(m.kind)(c, m, t, dt, kit);
  }
  // ---------- a motif forms out of clouds, stays, dissolves into them ----------
  // drawn through a layer of its own whenever it is not simply there: eaten by a field of cloud as it comes or goes
  // (p: how much of it is there, 0–1), or faded (al)
  function throughLayer(m, t, dt, p, al) {
    const k = dpr * res * (tier() ? 1 : 0.75), w = Math.round(W * k), h = Math.round(H * k);
    if (layer.width !== w || layer.height !== h) { layer.width = w; layer.height = h; }
    lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over'; lg.globalAlpha = 1; lg.clearRect(0, 0, w, h);
    lg.setTransform(k, 0, 0, k, 0, 0);
    drawKind(lg, m, t, dt);
    lg.setTransform(1, 0, 0, 1, 0, 0);
    const [cx, cy] = mid(t);
    if (p < 1) {
      const f = (1 - p) * (EATEN.length - 1), i = Math.min(EATEN.length - 2, f | 0), mw = mk.width, mh = mk.height, s = t / 1000;
      mg.setTransform(1, 0, 0, 1, 0, 0); mg.globalCompositeOperation = 'source-over'; mg.clearRect(0, 0, mw, mh);
      for (const [tex, a] of [[EATEN[i], 1 - (f - i)], [EATEN[i + 1], f - i]]) { mg.globalAlpha = a; tile(mg, tex, mw, mh, 1.3 + 0.5 * p, s / 40 + drift, s / 90, 0.5); mg.globalCompositeOperation = 'lighter'; }
      mg.globalAlpha = 1;
      lg.globalCompositeOperation = 'destination-in'; lg.drawImage(mk, 0, 0, w, h);
    }
    const grow = 1 + 0.14 * (1 - p) ** 2;              // it widens as it goes, like smoke
    g.save(); g.globalAlpha = al * Math.min(1, p * 1.8); g.translate(cx, cy); g.scale(grow, grow); g.drawImage(layer, -cx, -cy, W, H); g.restore();
    if (p < 1) {                                       // and where it was, or will be, a mist glows in the dream's colours
      const mist = Math.sin(p * Math.PI) * 0.26 * al, R = Math.min(W, H) * 0.42, hue = hueOf(dream.col);
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let j = 0; j < 9; j++) {
        const an = j * 2.4 + t / 5200, rr = R * (0.25 + 0.75 * hash(m.seed, j)) * (1.25 - 0.45 * p);
        DreamBrush.stamp(g, DreamBrush.tinted(hue - 20 + j * 5), cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * 0.8, R * (0.5 + 0.3 * hash(m.seed, j + 50)), mist);
      }
      g.restore(); g.globalAlpha = 1;
    }
  }
  const there = (m, t) => Math.min(1, (t - m.born) / FORM) * (m.left ? Math.max(0, 1 - (t - m.left) / FORM) : 1);
  const trance = () => { const tr = (performance.now() - st.trance) / 20000; return tr > 0 && tr < 1 ? Math.min(1, tr * 6, (1 - tr) * 5) : 0; };
  const tranceEye = { kind: 'third', seed: 7, half: null };   // Dreamy Eyes in trance: here too the third eye opens
  function drawMotif(t, dt) {
    let m = motif.cur;
    if (m && m.left && t - m.left >= FORM) m = motif.cur = null;
    if (!m && motif.next && t >= motif.next.at) { m = motif.cur = motif.next; motif.next = null; m.born = t; }
    const tr = trance(), p = m ? ease(there(m, t)) : 0, al = m && m.kind === 'third' ? 1 : 1 - 0.92 * tr;
    if (m && p > 0.004 && al > 0.01) {
      if (p >= 1 && al >= 1) drawKind(g, m, t, dt); else throughLayer(m, t, dt, p, al);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
    if (tr > 0 && !(m && m.kind === 'third' && p >= 1)) { throughLayer(tranceEye, t, dt, 1, tr); g.globalAlpha = 1; }
  }
  // ---------- the small beings: where they are, how they fade ----------
  function edgeAt(edge, u, s) {
    if (edge === 'left') return [-s, H * (0.2 + 0.6 * u)];
    if (edge === 'right') return [W + s, H * (0.2 + 0.6 * u)];
    if (edge === 'top') return [W * (0.2 + 0.6 * u), -s];
    return [W * (0.2 + 0.6 * u), H + s];
  }
  const room = () => fps > 50 ? 3 : fps > 35 ? 2 : 1;
  function drawLiving(t) {
    const base = Math.min(W, H), style = DreamStyle.life();   // #221: drawn by the style world in use
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = life.length - 1; i >= 0; i--) {
      const d = life[i], age = t - d.born, p = age / d.life;
      if (p >= 1) { life.splice(i, 1); continue; }
      const s = base * 0.2 * d.sizeK * (SCALE[d.kind] || 1) * (1 + 0.06 * st.pulse);
      const [ax, ay] = edgeAt(d.enter, d.u[0], s * 1.6), [bx, by] = edgeAt(d.exit, d.u[1], s * 1.6);
      const q = ease(p), wob = Math.sin(p * Math.PI * 2 + d.wob) * s * 0.25;
      const nx = by - ay, ny = ax - bx, nl = Math.hypot(nx, ny) || 1;
      const x = lerp(ax, bx, q) + nx / nl * wob, y = lerp(ay, by, q) + ny / nl * wob;
      style.draw(g, { ...d, x, y, size: s, hue: hueOf(dream.col) + d.hueOff }, age, 0.8, s, y, { H });
    }
    g.restore(); g.globalAlpha = 1;
  }
  // ---------- the frame ----------
  let last = performance.now(), fps = 60, upWait = 8000, upAt = -1e9, held = false;
  function frame(t) {
    const real = (t - last) / 1000, dt = Math.min(0.1, real); last = t;
    fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
    // a weak device draws with fewer pixels and less detail until it keeps up (like Dreamy Eyes, #188)
    if (fps < 38) { if (!slowSince) slowSince = t; fastSince = 0; } else if (fps > 52) { if (!fastSince) fastSince = t; slowSince = 0; }
    const step = held ? -1 : STEPS.indexOf(res);       // (a test holds the pixels where it set them)
    if (step >= 0 && slowSince && t - slowSince > 2500 && step < STEPS.length - 1) {
      if (t - upAt < upWait + 6000) upWait = Math.min(upWait * 2, 120000);   // went up and could not hold it: wait longer
      res = STEPS[step + 1]; slowSince = t; size();
    }
    if (step > 0 && fastSince && t - fastSince > upWait) { res = STEPS[step - 1]; fastSince = t; upAt = t; size(); }
    st.pulse *= Math.pow(0.04, dt);                    // the pulse fades within a beat
    picTick();
    // #224: one world, or two added up; what is asked of the style layer between `paint` and the next is that world's
    const plan = DreamStyle.plan(real, mix.hold ? { hold: mix.hold } : { fps, tier: tier() });
    mix.pair = plan.length > 1;
    plan.forEach(([world, weight], i) => {
      DreamStyle.paint(world); g = main;
      if (i) {
        if (mix.cv.width !== cv.width || mix.cv.height !== cv.height) { mix.cv.width = cv.width; mix.cv.height = cv.height; }
        g = mix.g; g.setTransform(dpr * res, 0, 0, dpr * res, 0, 0);
      }
      scene(t, i ? 0 : dt);
      main.save(); main.setTransform(1, 0, 0, 1, 0, 0);
      if (i) { main.globalCompositeOperation = 'lighter'; main.globalAlpha = weight; main.drawImage(mix.cv, 0, 0); }
      else if (weight < 0.999) { main.fillStyle = `rgba(0,0,0,${1 - weight})`; main.fillRect(0, 0, cv.width, cv.height); }
      main.restore();
    });
    g = main; DreamStyle.paint(plan[mix.pair && plan[1][1] > 0.5 ? 1 : 0][0]);   // between frames: the world that shows most
    if (!mix.pair && mix.cv.width > 1) mix.cv.width = mix.cv.height = 1;       // one world again: the layer's memory back
    if (st.master < 0.999) { g.fillStyle = `rgba(0,0,0,${1 - st.master})`; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  function scene(t, dt) {                              // the whole picture of this frame, in the world in hand
    const breath = 0.5 + 0.5 * Math.sin(now() / 9000 * Math.PI * 2);   // all windows breathe together (Dream's clock)
    const tr = trance();
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    clouds(t, breath);
    g.globalAlpha = (0.72 + 0.16 * breath + 0.12 * st.pulse) * (1 - 0.55 * tr); g.drawImage(cl, 0, 0, W, H);
    const spill = (0.1 + 0.08 * breath + 0.3 * st.pulse) * (1 - 0.55 * tr);   // their light spills over a little, more on the beat
    if (tier() > 0 || spill > 0.2) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = spill; g.drawImage(cl, -W * 0.05, -H * 0.05, W * 1.1, H * 1.1); }
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    const air = DreamStyle.part('air');                // #222: what fills the night of a world (today's look: nothing)
    if (air) { air.draw(g, t, { W, H, hue: hueOf(dream.col), tier: tier(), of: 'window' }); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    drawLiving(t);
    drawMotif(t, dt);
    const wk = (t - st.wave) / 650;                    // the wave passes: a soft bloom of light
    const bk = (t - st.blush) / 1200;                  // the eyes blush: a rosy shimmer passes
    for (const [k, col] of [[wk, [dream.col[0] + 80, dream.col[1] + 80, dream.col[2] + 80]], [bk, [255, 120, 165]]]) {
      if (k <= 0 || k >= 1) continue;
      const a = Math.sin(k * Math.PI) * 0.55, gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
      gr.addColorStop(0, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
    }
  }
  if (new URLSearchParams(location.search).has('debug')) {   // for the tests only
    window.dreamWindow = { st, dream, faces, life, motif, sow, show, faceOf, cloud: cl, frame: { canvas: cv, get t() { return last; } },
      get res() { return res; }, set res(v) { if (STEPS.includes(v)) { res = v; held = true; size(); } }, get fps() { return fps; }, get tier() { return tier(); } };
  }
  connect();
  requestAnimationFrame(frame);
})();
</script>
